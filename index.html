// ===== modules/scroll-progress.jsx =====

// ─── SCROLL PROGRESS INDICATOR ───────────────────────────────────────────────
// A fixed corner read-out that climbs 0% → 100% as the user moves through the
// page. Modeled on the Sui scroll counter. Two render modes:
//
//   - Desktop (≥768px): a small "0%" → "100%" counter at top-left of the
//     viewport in FF.ui 12px. The number is navy on light bg / cyan on dark
//     bg (driven by the active chapter's tint — see chapter-marker.jsx —
//     or default navy if no chapter is active).
//   - Mobile (<768px): a 2px cyan bar pinned to the very top of the viewport,
//     filling left → right as the user scrolls.
//
// The indicator is hidden while the hero is still in view (any scrollY <
// HERO_THRESHOLD) so it doesn't fight the transparent nav over the hero.
// It also fades out near the final CTA so the dramatic close doesn't
// fight a stray UI chip.
//
// Skipped entirely under prefers-reduced-motion.

const ScrollProgress = () => {
  const T = window.T, FF = window.FF;
  const reduced = window.usePrefersReducedMotion();
  const [pct, setPct]   = React.useState(0);
  const [show, setShow] = React.useState(false);
  const [tint, setTint] = React.useState('light'); // 'light' = page bg light → use navy ink; 'dark' = navy bg → use cyan
  const [isMobile, setIsMobile] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth < 768 : false
  );

  React.useEffect(() => {
    if (reduced) return;

    const HERO_HIDE_PX = 240;   // hide while hero is still on screen
    const FOOTER_FADE_PX = 320; // fade as we approach footer / final CTA

    const onScroll = () => {
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop || 0;
      const max = (doc.scrollHeight - window.innerHeight) || 1;
      const p = Math.max(0, Math.min(1, scrollTop / max));
      setPct(p);
      // Hide near top (hero) and very bottom (final CTA / footer)
      const distFromBottom = (doc.scrollHeight - (scrollTop + window.innerHeight));
      const visible = scrollTop > HERO_HIDE_PX && distFromBottom > FOOTER_FADE_PX;
      setShow(visible);

      // Figure out the underlying chapter's tint at the viewport midpoint.
      // ChapterMarker uses the same approach; we read the same data attribute.
      const probeY = window.innerHeight * 0.5;
      const els = document.elementsFromPoint(40, probeY);
      let resolved = 'light';
      for (const el of els) {
        const node = el.closest('[data-sp-chapter-tint]');
        if (node) {
          resolved = node.getAttribute('data-sp-chapter-tint') || 'light';
          break;
        }
        // also detect raw navy/cyan section backgrounds without a chapter wrapper
        if (el.dataset && el.dataset.spSectionTint) {
          resolved = el.dataset.spSectionTint;
          break;
        }
      }
      setTint(resolved);
    };

    const onResize = () => setIsMobile(window.innerWidth < 768);

    onScroll();
    onResize();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onResize);
    };
  }, [reduced]);

  if (reduced) return null;

  if (isMobile) {
    // 2px cyan bar at very top of viewport, animated width
    return (
      <div
        aria-hidden="true"
        style={{
          position: 'fixed',
          top: 0, left: 0, right: 0,
          height: 2,
          background: 'rgba(255,255,255,0.06)',
          zIndex: 999,
          opacity: show ? 1 : 0,
          transition: `opacity 240ms ${T.ease}`,
          pointerEvents: 'none',
        }}
      >
        <div style={{
          height: '100%',
          width: `${pct * 100}%`,
          background: T.cyan,
          transition: 'width 120ms linear',
        }} />
      </div>
    );
  }

  // Desktop counter — top-left
  const isDark = tint === 'dark';
  const color = isDark ? T.cyan : T.navy;
  return (
    <div
      role="status"
      aria-label={`${Math.round(pct * 100)} percent of page scrolled`}
      style={{
        position: 'fixed',
        top: 96, left: 24,
        zIndex: 150,
        opacity: show ? 1 : 0,
        transform: show ? 'translateY(0)' : 'translateY(-6px)',
        transition: `opacity 280ms ${T.ease}, transform 280ms ${T.ease}, color 280ms ${T.ease}`,
        pointerEvents: 'none',
        display: 'flex', alignItems: 'center', gap: 8,
        fontFamily: FF.ui,
        fontSize: 'clamp(12px, 0.7vw + 6px, 14px)',
        fontWeight: 600,
        letterSpacing: '0.12em',
        textTransform: 'uppercase',
        color,
        userSelect: 'none',
      }}
    >
      {/* Tiny progress dot — also reads the tint */}
      <span
        aria-hidden="true"
        style={{
          width: 6, height: 6, borderRadius: '50%',
          background: color,
          boxShadow: `0 0 0 3px ${isDark ? 'rgba(108, 195, 219,0.18)' : 'rgba(8, 33, 61,0.10)'}`,
        }}
      />
      <span style={{ minWidth: 36, textAlign: 'left' }}>
        {String(Math.round(pct * 100)).padStart(2, '0')}%
      </span>
    </div>
  );
};

// ─── CHAPTER MARKERS ─────────────────────────────────────────────────────────
// Desktop-only (≥1024px) fixed left-edge label that updates as the user
// scrolls through sections marked with the <Chapter> wrapper:
//
//   <Chapter number="01" label="FIND YOUR FIT" tint="light">
//     ...section content...
//   </Chapter>
//
// `tint` is the page background underneath the chapter (so the marker can
// pick navy text on light bgs and cyan text on dark/navy bgs).
//
// The marker fades out near the hero (no chapter is active yet) and near
// the final CTA (no chapter to label). It does NOT mark the trust strip
// or the final CTA band — those sections render without a <Chapter>
// wrapper, and the marker simply hides while they're on screen.
//
// Skipped entirely under prefers-reduced-motion.

const Chapter = ({ number, label, tint = 'light', id, children }) => {
  // Just a transparent wrapper that the marker observer can read. Doesn't
  // add any visual chrome of its own — the section inside provides all that.
  return (
    <div
      data-sp-chapter
      data-sp-chapter-number={number}
      data-sp-chapter-label={label}
      data-sp-chapter-tint={tint}
      id={id}
      style={{ position: 'relative' }}
    >
      {children}
    </div>
  );
};

const ChapterMarker = () => {
  const T = window.T, FF = window.FF;
  const reduced = window.usePrefersReducedMotion();
  const [active, setActive] = React.useState(null); // { number, label, tint }
  const [show, setShow]     = React.useState(false);
  // Only render when there's enough horizontal gutter outside the 1200px
  // content area for the marker (max-width ~200px + 24px gap) to sit
  // without overlapping section content. That requires viewport >= 1648px,
  // but as a practical breakpoint we use 1440px since most "wide desktop"
  // viewports are in that range and we accept a small overlap into the
  // section's 60px gutter padding — but never into the content itself.
  // Below 1440px, no marker is shown so content is never obscured.
  const MARKER_BREAKPOINT = 1440;
  const [isDesktop, setIsDesktop] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth >= MARKER_BREAKPOINT : false
  );

  React.useEffect(() => {
    if (reduced) return;

    const onResize = () => setIsDesktop(window.innerWidth >= MARKER_BREAKPOINT);
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [reduced]);

  React.useEffect(() => {
    if (reduced) return;

    const FOOTER_FADE_PX = 320;

    const compute = () => {
      const chapters = Array.from(document.querySelectorAll('[data-sp-chapter]'));
      if (!chapters.length) { setActive(null); setShow(false); return; }

      const viewportMid = window.innerHeight * 0.45;
      let chosen = null;
      for (const ch of chapters) {
        const r = ch.getBoundingClientRect();
        // Active when the chapter occupies the viewport mid-line
        if (r.top <= viewportMid && r.bottom >= viewportMid) {
          chosen = ch;
          break;
        }
      }

      if (!chosen) {
        setActive(null);
        setShow(false);
        return;
      }

      setActive({
        number: chosen.getAttribute('data-sp-chapter-number'),
        label:  chosen.getAttribute('data-sp-chapter-label'),
        tint:   chosen.getAttribute('data-sp-chapter-tint') || 'light',
      });

      // Hide near the bottom of the page so the final CTA stays clean
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const distFromBottom = document.documentElement.scrollHeight - (scrollTop + window.innerHeight);
      setShow(distFromBottom > FOOTER_FADE_PX);
    };

    compute();
    window.addEventListener('scroll', compute, { passive: true });
    window.addEventListener('resize', compute);
    // Also recompute after page transitions — a tick later catches lazy renders
    const t = setTimeout(compute, 200);
    return () => {
      window.removeEventListener('scroll', compute);
      window.removeEventListener('resize', compute);
      clearTimeout(t);
    };
  }, [reduced]);

  if (reduced || !isDesktop || !active || !show) return null;

  const isDark = active.tint === 'dark';
  // White on dark/cyan sections (cyan would be invisible against cyan bg);
  // navy on light sections. White stands out on both navy and cyan.
  const color = isDark ? '#fff' : T.navy;

  return (
    <div
      aria-hidden="true"
      style={{
        position: 'fixed',
        left: 24,
        top: '50%',
        transform: 'translateY(-50%)',
        zIndex: 140,
        pointerEvents: 'none',
        fontFamily: FF.ui,
        fontSize: 'clamp(11px, 0.7vw + 5px, 14px)',
        fontWeight: 600,
        letterSpacing: '0.18em',
        textTransform: 'uppercase',
        color,
        userSelect: 'none',
        opacity: show ? 1 : 0,
        transition: `opacity 320ms ${T.ease}, color 320ms ${T.ease}`,
        display: 'flex', alignItems: 'center', gap: 10,
        maxWidth: 240,
      }}
    >
      <span style={{
        display: 'inline-block',
        width: 28, height: 1,
        background: color,
        opacity: 0.5,
      }} />
      <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{
          fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)',
          color, letterSpacing: '0.04em',
        }}>{active.number}</span>
        <span style={{ opacity: 0.6 }}>/</span>
        <span>{active.label}</span>
      </span>
    </div>
  );
};

window.Chapter = Chapter;
window.ChapterMarker = ChapterMarker;

const PinnedPathway = () => {
  const T = window.T, FF = window.FF;
  const SiteIcon = window.SiteIcon;
  const reduced = window.usePrefersReducedMotion();
  const [active, setActive] = React.useState(1);
  const [isMobile, setIsMobile] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth < 900 : false
  );
  const panelRefs = React.useRef([]);
  // Spine height tracks viewport height so all 5 nodes are always visible.
  // Declared HERE (above the mobile early-return) so the hook count never
  // changes between renders when isMobile/reduced flips (React #310).
  const [vh, setVh] = React.useState(
    typeof window !== 'undefined' ? window.innerHeight : 800
  );
  React.useEffect(() => {
    const onResize = () => setVh(window.innerHeight);
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);

  // viewport midline.
  React.useEffect(() => {
    if (reduced || isMobile) return;

    const onScroll = () => {
      const mid = window.innerHeight * 0.5;
      let bestIdx = 0;
      let bestDist = Infinity;
      panelRefs.current.forEach((el, i) => {
        if (!el) return;
        const r = el.getBoundingClientRect();
        const center = (r.top + r.bottom) / 2;
        const d = Math.abs(center - mid);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      setActive(PINNED_NODES[bestIdx].n);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [reduced, isMobile]);

  // ─── MOBILE / REDUCED MOTION FALLBACK ──────────────────────────────────
  if (isMobile || reduced) {
    return (
      <div style={{ maxWidth: 720, margin: '0 auto' }}>
        {PINNED_NODES.map((node, i) => (
          <div key={node.n} style={{
            padding: '32px 0',
            borderTop: i === 0 ? 'none' : `1px solid ${T.border}`,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
              <div style={{
                width: 48, height: 48, borderRadius: '50%',
                background: T.navy, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(20px, 0.4vw + 14px, 22px)',
                flexShrink: 0,
              }}>{String(node.n).padStart(2, '0')}</div>
              <div style={{
                fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(13px, 0.7vw + 7px, 14px)',
                color: T.cyanDark, letterSpacing: '0.16em', textTransform: 'uppercase',
              }}>{node.label}</div>
            </div>
            <h3 style={{
              fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(23px, 1.4vw + 13px, 30px)',
              color: T.white, margin: '0 0 12px', lineHeight: 1.25,
              letterSpacing: '-0.005em',
            }}>{node.headline}</h3>
            <p style={{
              fontFamily: FF.body, fontSize: 'clamp(16px, 0.3vw + 12px, 18px)', lineHeight: 1.65,
              color: T.ink, margin: '0 0 18px',
            }}>{node.body}</p>
            <div style={{
              borderLeft: `3px solid ${T.cyan}`,
              padding: '6px 0 6px 14px',
              fontFamily: FF.body, fontSize: 'clamp(15px, 0.3vw + 11px, 17px)', fontStyle: 'italic',
              color: T.ink, lineHeight: 1.5,
            }}>
              "{node.quote}"
              <div style={{
                fontFamily: FF.ui, fontStyle: 'normal',
                fontSize: 'clamp(12px, 0.7vw + 6px, 14px)', color: T.inkMuted, marginTop: 6,
                letterSpacing: '0.04em',
              }}>{node.quoteAuthor}</div>
            </div>
          </div>
        ))}

  // ─── DESKTOP PINNED LAYOUT ────────────────────────────────────────────
  // 220px of vertical chrome (header + h2 + nav padding + safe margin) lives
  // above the spine; whatever's left in the viewport becomes the spine.

  const SPINE_H = Math.max(360, Math.min(520, vh - 220));
  const nodeY = (i) => 30 + i * ((SPINE_H - 60) / (PINNED_NODES.length - 1));

  return (
    <div style={{
      // Panels (60fr) on the LEFT, sticky spine (40fr) on the RIGHT.
      display: 'grid', gridTemplateColumns: '60fr 40fr', gap: 56,
      maxWidth: 'clamp(1200px, 78vw, 1440px)', margin: '0 auto',

        {PINNED_NODES.map((node, i) => (

            key={node.n}
            node={node}
            index={i}
            isLast={i === PINNED_NODES.length - 1}
            panelRef={(el) => { panelRefs.current[i] = el; }}

          height so we can flex-center the spine content vertically. The
          spine itself scales (SPINE_H) so all 5 step nodes always fit in

      <nav
        aria-label="The Synergy Method, jump to step"
        style={{
          gridColumn: 2, gridRow: 1,
          position: 'sticky',

          height: '100vh',

          fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(27px, 1.6vw + 14px, 38px)',
          color: T.white, margin: '0 0 24px', lineHeight: 1.2,
          letterSpacing: '-0.005em',
        }}>
          Five steps. <span style={{ fontStyle: 'italic', color: T.cyan }}>One clear plan.</span>
        </h2>

        <svg width="100%" height={SPINE_H} viewBox={`0 0 220 ${SPINE_H}`} style={{ maxWidth: 360 }}>
          {/* Background spine — full grey line */}
          <line x1="32" y1={nodeY(0)} x2="32" y2={nodeY(PINNED_NODES.length - 1)}
            stroke={T.border} strokeWidth="3" strokeLinecap="round" />
          {/* Filled spine — climbs to the active node */}
          <line x1="32" y1={nodeY(0)} x2="32" y2={nodeY(active - 1)}
            stroke={T.cyan} strokeWidth="3" strokeLinecap="round"
            style={{ transition: `y2 600ms ${T.easeOut}` }} />

          {/* Nodes + labels — clickable anchor links. Clicking a node

              center of the viewport, so users can jump from one step to
              another without scrolling manually. */}

            const isActive = active === node.n;
            const isPast   = active > node.n;

              const el = panelRefs.current[i];
              if (!el) return;
              const r = el.getBoundingClientRect();

                <rect
                  x="0" y={nodeY(i) - 22} width="220" height="44"
                  fill="transparent"
                />
                {/* Halo on active */}
                {isActive && (
                  <circle cx="32" cy={nodeY(i)} r="22"
                    fill={T.cyan} opacity="0.15" />
                )}
                <circle
                  cx="32" cy={nodeY(i)}
                  r={isActive ? 14 : 11}
                  fill={isActive || isPast ? T.cyan : '#fff'}
                  stroke={isActive || isPast ? T.cyan : T.navy}
                  strokeWidth="2.5"
                  style={{
                    transition: `r 320ms ${T.easeBounce}, fill 320ms ${T.ease}, stroke 320ms ${T.ease}, opacity 320ms ${T.ease}`,

                  }}
                />
                <text
                  x="32" y={nodeY(i) + 4}
                  textAnchor="middle"
                  style={{
                    fontFamily: 'Lora, serif', fontSize: 'clamp(11px, 0.7vw + 5px, 14px)', fontWeight: 700,
                    fill: isActive || isPast ? '#fff' : T.navy,
                    opacity: dim, transition: `opacity 320ms ${T.ease}`,
                    pointerEvents: 'none',
                  }}
                >{String(node.n).padStart(2, '0')}</text>
                <text
                  x="58" y={nodeY(i) + 5}
                  style={{
                    fontFamily: 'Ovo, serif',
                    fontSize: isActive ? 16 : 14,
                    fontWeight: isActive ? 700 : 500,
                    fill: isActive ? T.navy : T.inkMuted,
                    opacity: dim,
                    letterSpacing: '0.04em',

                    pointerEvents: 'none',
                  }}

// One left-column panel. Renders a big animated SiteIcon for every node
// (1-5) that fades + scales + lifts in as the panel scrolls into view.
//
// The panel itself is split into two inner columns:
//   - Left rail (56px wide) — holds the numbered chip on top, and a
//     dashed cyan connector line BELOW the chip that runs to the next
//     panel's chip. Because the rail is its own column, the line never
//     overlaps the headline, body, quote, or icon card.
//   - Content column (1fr) — step label, icon card, headline, body,
//     parent quote.
//
// The dashed line's stroke-dashoffset is driven by the user's scroll
// position so the line "draws" progressively as you move down the page.
const PinnedPanel = ({ node, index, panelRef, reduced, isLast }) => {
  const T = window.T, FF = window.FF;
  const SiteIcon = window.SiteIcon;
  const [iconRef, iconInView] = window.useInView({ threshold: 0.35, once: true });

  // Scroll-driven draw progress for the dashed connector line. 0 = not drawn,
  // 1 = fully drawn. Maps the user's scroll position from THIS panel's chip
  // down to the NEXT panel's chip (a one-chip-to-the-next chip distance).
  //
  // Updates run inside requestAnimationFrame so the line tracks scroll at
  // 60fps without jitter, and dashLength is recomputed from the actual
  // panel height so the line ends precisely at the next chip.
  const elRef = React.useRef(null);
  const [drawProgress, setDrawProgress] = React.useState(0);
  const [lineLen,      setLineLen]      = React.useState(900);

  const setRefs = (el) => {
    elRef.current = el;
    if (panelRef) panelRef(el);
    if (iconRef && typeof iconRef === 'object') iconRef.current = el;
  };

  React.useEffect(() => {
    if (reduced || isLast) return;
    let rafId = 0;
    let pending = false;

    const compute = () => {
      pending = false;
      const el = elRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;

      // Reference line in viewport: 35% from top — this is roughly where
      // the chip lives when the panel is "current". When the chip is here,
      // progress = 0. When the NEXT chip arrives here, progress = 1.
      const refY   = vh * 0.35;
      const chipY  = r.top + 60;                // panel padding-top approx aligns chip
      const passed = refY - chipY;              // px scrolled past current chip
      const total  = r.height;                  // panel height = one chip-to-next-chip distance
      const raw    = passed / total;
      setDrawProgress(Math.max(0, Math.min(1, raw)));

      // The drawn line should span from this panel's chip down to the next
      // panel's chip — that's exactly the panel's height minus the chip
      // height (~60px). Size the line to that.
      setLineLen(Math.max(40, total - 60));
    };

    const onScroll = () => {
      if (pending) return;
      pending = true;
      rafId = requestAnimationFrame(compute);
    };

    compute();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      cancelAnimationFrame(rafId);
    };
  }, [reduced, isLast]);

  // The line is always fully drawn — visibility is now controlled by a CSS
  // mask that creates a soft "spotlight" window centered on the scroll
  // position. The window sweeps from above the line (drawProgress=0) to
  // below it (drawProgress=1), so the dashes appear to gradually come in
  // from the top and exit at the bottom as the user scrolls through the
  // panel, instead of drawing-and-staying.
  //
  // Stops along the line height (0–100%):
  //   transparent ── soft fade ── black ── black ── soft fade ── transparent
  // with the centre marching from -25% → 125% as drawProgress goes 0 → 1.
  const center = -25 + drawProgress * 150;
  const s1 = (center - 22).toFixed(2);  // outer top — fade-in begins
  const s2 = (center - 10).toFixed(2);  // inner top — fully visible
  const s3 = (center + 10).toFixed(2);  // inner bot — fully visible
  const s4 = (center + 22).toFixed(2);  // outer bot — fade-out ends
  const maskValue = reduced
    ? 'none'
    : `linear-gradient(to bottom, transparent 0%, transparent ${s1}%, black ${s2}%, black ${s3}%, transparent ${s4}%, transparent 100%)`;

  return (
    <div
      ref={setRefs}
      style={{
        minHeight: '80vh',
        padding: '60px 0',
        display: 'flex', flexDirection: 'column', justifyContent: 'center',
        borderTop: index === 0 ? 'none' : `1px dashed ${T.border}`,
        position: 'relative',
      }}
    >
      <div style={{
        display: 'grid',
        gridTemplateColumns: '56px minmax(0, 1fr)',
        columnGap: 20,
        alignItems: 'start',
      }}>
        {/* LEFT RAIL — numbered chip + dashed connector below it */}
        <div style={{
          position: 'relative',
          gridRow: '1 / -1',
          minHeight: '100%',
        }}>
          {/* Numbered chip — light cyan resting state. When the panel enters
              the user's viewport, a cyan disc scales in from the centre to
              FILL the chip (ink-drop effect) while the numeral colour cross-
              fades from cyanDark → white on top of it. A soft halo grows in
              tandem so the chip reads as "lit". */}
          <span style={{
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            width: 56, height: 56, borderRadius: '50%',
            background: T.cyanLight,
            fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(20px, 1.4vw + 12px, 26px)',
            border: `2px solid ${T.cyan}`,
            position: 'relative', zIndex: 2,
            overflow: 'hidden',
            boxShadow: iconInView
              ? '0 6px 18px rgba(108, 195, 219,0.45), 0 0 0 6px rgba(108, 195, 219,0.12)'
              : '0 2px 6px rgba(8, 33, 61,0.08)',
            transition: reduced
              ? 'none'
              : `box-shadow 540ms ${T.ease}`,
          }}>
            {/* Cyan ink-drop fill — scales 0 → 1 from the centre when the
                panel enters the viewport. `overflow: hidden` on the parent
                clips this disc to the chip's circle. */}
            <span aria-hidden="true" style={{
              position: 'absolute', inset: 0,
              background: T.cyan,
              borderRadius: '50%',
              transform: reduced
                ? (iconInView ? 'scale(1)' : 'scale(0)')
                : (iconInView ? 'scale(1)' : 'scale(0)'),
              transformOrigin: 'center',
              transition: reduced
                ? 'none'
                : `transform 620ms ${T.easeBounce}`,
              zIndex: 1,
            }} />
            {/* Numeral — sits above the fill so the colour cross-fade reads
                clearly over the cyan disc. */}
            <span style={{
              position: 'relative', zIndex: 2,
              color: iconInView ? '#fff' : T.cyanDark,
              transition: reduced ? 'none' : `color 380ms ${T.ease} 180ms`,
            }}>
              {String(node.n).padStart(2, '0')}
            </span>
          </span>

          {/* Dashed connector — sits in the rail column only, so it never
              crosses content. The line's pixel length matches the actual
              chip-to-next-chip distance, so the drawn portion always ends
              exactly at the next chip. */}
          {!isLast && (
            <svg
              aria-hidden="true"
              width="2" height={lineLen} preserveAspectRatio="none"
              style={{
                position: 'absolute',
                top: 56,            // immediately below the chip

                zIndex: 1,
                overflow: 'visible',
                // Spotlight mask follows the scroll — recomputed every frame
                // from the scroll handler, so the visible band glides instead
                // of stepping. No CSS transition on `mask` (it lerps natively
                // because the gradient stops shift every animation frame).
                mask: maskValue,
                WebkitMask: maskValue,
                opacity: reduced ? 0.85 : 1,
              }}
            >
              <line
                x1="1" y1="0" x2="1" y2={lineLen}
                stroke={T.cyan}

        {/* RIGHT CONTENT */}
        <div>
          <div style={{

            color: T.cyanDark, letterSpacing: '0.16em', textTransform: 'uppercase',

            >

// ===== modules/hero-spotlight.jsx =====

// ─── HERO SPOTLIGHT + AURORA ──────────────────────────────────────────────────
// Ported from new-sp-website (Netlify reference). Two layered effects:
//
//   1. AURORA — 3 blurred radial blobs that drift on their own loops AND
//      parallax-translate (about 26px max) with the cursor. Sits z-index 0
//      behind hero content.
//   2. SPOTLIGHT — 540×540 cyan radial gradient that follows the cursor inside
//      the hero only. Opacity 0 → 1 on .hero hover. Sits z-index 1.
//
// Both honor prefers-reduced-motion:
//   - Aurora: keyframes paused, parallax-translate still tracks cursor
//     (cursor tracking is not motion-triggered, the user is moving the mouse).
//   - Spotlight: hidden entirely (per the original Netlify reference).
//
// Mount these inside the hero section. The parent section must be
// `position: relative; overflow: hidden;` (already true for the home hero).
//
//   <section className="sp-hero" ...>
//     <HeroAurora />
//     <HeroSpotlight />
//     {/* hero content here at z-index 2+ */}
//   </section>

// Inject the keyframes + hover rule once on first mount.
const ensureSpotlightStyles = () => {
  if (document.getElementById('sp-hero-fx-styles')) return;
  const style = document.createElement('style');
  style.id = 'sp-hero-fx-styles';
  style.textContent = `
    @keyframes sp-aurora-drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,46px) scale(1.14); } }
    @keyframes sp-aurora-drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-56px,-34px) scale(1.1); } }
    @keyframes sp-aurora-drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-44px,34px) scale(1.16); } }
    /* Spotlight: opacity 0 by default, fades in on hero hover */
    .sp-hero-fx-spotlight { opacity: 0; transition: opacity 500ms ease; }
    .sp-hero-fx-host:hover .sp-hero-fx-spotlight { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .sp-hero-fx-aurora-blob { animation: none !important; }
      .sp-hero-fx-spotlight { display: none !important; }
    }
  `;
  document.head.appendChild(style);
};

const HeroAurora = () => {
  const reduced = window.usePrefersReducedMotion();
  const containerRef = React.useRef(null);

  React.useEffect(() => { ensureSpotlightStyles(); }, []);

  // Cursor-driven parallax — translate the whole aurora group by up to ±26px
  // based on mouse position. Listen on document so the effect works even when
  // the cursor is over hero content (not just background).
  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - 0.5);
      const y = (e.clientY / window.innerHeight - 0.5);
      el.style.transform = `translate(${x * 26}px, ${y * 26}px)`;
    };
    document.addEventListener('mousemove', onMove);
    return () => document.removeEventListener('mousemove', onMove);
  }, []);

  return (
    <div
      ref={containerRef}
      aria-hidden="true"
      style={{
        position: 'absolute', inset: '-10%',
        zIndex: 0, pointerEvents: 'none',
        transition: 'transform 400ms ease-out',
      }}
    >
      <span className="sp-hero-fx-aurora-blob" style={{
        position: 'absolute', borderRadius: '50%', filter: 'blur(72px)', opacity: 0.5,
        width: 540, height: 540, background: '#1E6FA8',
        top: -150, left: -60,
        animation: reduced ? 'none' : 'sp-aurora-drift1 17s ease-in-out infinite',
      }} />
      <span className="sp-hero-fx-aurora-blob" style={{
        position: 'absolute', borderRadius: '50%', filter: 'blur(72px)', opacity: 0.5,
        width: 480, height: 480, background: '#2BB7D6',
        bottom: -200, right: '6%',
        animation: reduced ? 'none' : 'sp-aurora-drift2 21s ease-in-out infinite',
      }} />
      <span className="sp-hero-fx-aurora-blob" style={{
        position: 'absolute', borderRadius: '50%', filter: 'blur(72px)', opacity: 0.5,
        width: 400, height: 400, background: '#0E4C8A',
        top: '18%', right: -130,
        animation: reduced ? 'none' : 'sp-aurora-drift3 24s ease-in-out infinite',
      }} />
    </div>
  );
};

const HeroSpotlight = () => {
  const spotRef = React.useRef(null);

  React.useEffect(() => { ensureSpotlightStyles(); }, []);

  // The spotlight is positioned (left, top) relative to its hero parent.
  // Find the closest ancestor with class 'sp-hero-fx-host' (the hero <section>)
  // and translate the spotlight to cursor location within that section.
  React.useEffect(() => {
    const spot = spotRef.current;
    if (!spot) return;
    const host = spot.closest('.sp-hero-fx-host');
    if (!host) return;
    const onMove = (e) => {
      const r = host.getBoundingClientRect();
      if (e.clientY - r.top > r.height) return; // only track inside hero
      spot.style.left = `${e.clientX - r.left}px`;
      spot.style.top  = `${e.clientY - r.top}px`;
    };
    document.addEventListener('mousemove', onMove);
    return () => document.removeEventListener('mousemove', onMove);
  }, []);

  return (
    <div
      ref={spotRef}
      aria-hidden="true"
      className="sp-hero-fx-spotlight"
      style={{
        position: 'absolute',
        width: 540, height: 540,
        left: '50%', top: '32%',
        transform: 'translate(-50%, -50%)',
        zIndex: 1, pointerEvents: 'none',
        background: 'radial-gradient(circle, rgba(111,197,219,0.20), rgba(111,197,219,0) 62%)',
      }}
    />
  );
};

window.HeroAurora = HeroAurora;
window.HeroSpotlight = HeroSpotlight;

// Layout: a 112px circular icon badge floats half above the card's top edge.
// The card itself starts at the title. On hover the whole group lifts and
// the icon badge pops in scale.
const ProgramCard = ({ slug, title, body, iconKey, navigate }) => {
  const [hov, setHov] = React.useState(false);
  const Icon = window.SUBJECT_ICONS && window.SUBJECT_ICONS[iconKey];

  return (
    // Outer wrapper carries the click target + the lift transform. Padding-top
    // reserves the half of the icon badge that sits above the card.
    <div
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      onClick={() => navigate(slug)}
      role="button" tabIndex={0}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate(slug); } }}
      aria-label={`Explore ${title}`}
      style={{
        position: 'relative',
        paddingTop: 56,      // reserves space for the floating icon
        cursor: 'pointer',
        transform: hov ? 'translateY(-4px)' : 'translateY(0)',
        transition: `transform ${T.dur2} ${T.ease}`,
      }}
    >
      {/* Floating circular icon badge — half above the card top edge */}
      <div
        aria-hidden="true"
        style={{
          position: 'absolute',
          top: 0, left: '50%',
          transform: hov ? 'translateX(-50%) scale(1.06)' : 'translateX(-50%) scale(1)',
          width: 112, height: 112,
          borderRadius: '50%',
          background: T.surface1,
          border: `2px solid ${hov ? T.cyan : T.border}`,
          boxShadow: hov ? T.shadowHover : T.shadow,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          zIndex: 2,
          transition: `all ${T.dur2} ${T.easeBounce}`,
        }}
      >
        <div style={{
          width: 84, height: 84,
          background: T.cyanLight, borderRadius: '50%',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          {Icon && <div style={{ width: 60, height: 60 }}><Icon T={T} /></div>}
        </div>
      </div>

      {/* The card — starts at the title, doesn't include the icon. Extra
          top-padding (60px) leaves room for the icon badge that overlaps. */}
      <div style={{
        background: T.surface1,
        border: `2px solid ${hov ? T.cyan : T.border}`,
        borderRadius: T.r3,
        padding: '76px 36px 36px',
        boxShadow: hov ? T.shadowPopHover : T.shadowPop,
        transition: `all ${T.dur2} ${T.ease}`,
        display: 'flex', flexDirection: 'column', gap: 16,
        minHeight: 300,
        textAlign: 'center',
        transformStyle: 'preserve-3d',
      }}>
        <h3 style={{
          fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(24px, 1.4vw + 14px, 32px)',
          color: T.white, margin: 0, letterSpacing: '-0.005em',

        <p style={{
          fontFamily: FF.body, fontSize: 'clamp(17px, 0.3vw + 13px, 19px)', lineHeight: 1.6,
          color: T.ink, margin: 0, flex: 1,
        }}>{body}</p>
        <div style={{
          fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(15px, 0.3vw + 11px, 17px)',
          color: hov ? T.cyanDark : T.cyan,
          marginTop: 'auto',
          transition: `color ${T.dur1} ${T.ease}`,

  );

const ProofStatsTabbed = ({ navigate }) => {
  const [active, setActive] = React.useState(0);
  const reduced = usePrefersReducedMotion();
  const [ref, inView] = useInView({ threshold: 0.3, once: true });
  const [displayValue, setDisplayValue] = React.useState(reduced ? PROOF_STAT_TABS[0].value : 0);
  const prevValueRef = React.useRef(0);

  // Tween from previous → new value when the active tab changes (or on first
  // scroll-into-view).
  React.useEffect(() => {
    if (!inView) return;
    const target = PROOF_STAT_TABS[active].value;
    const from = prevValueRef.current;
    if (reduced) { setDisplayValue(target); prevValueRef.current = target; return; }
    const dur = 800;
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplayValue(from + (target - from) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else { setDisplayValue(target); prevValueRef.current = target; }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [active, inView, reduced]);

  const labels = PROOF_STAT_TABS.map(t => t.label);
  const stat = PROOF_STAT_TABS[active];

  return (
    <section
      ref={ref}
      data-sp-section-tint="dark"
      style={{
        background: T.navy, padding: '120px 0', position: 'relative', overflow: 'hidden',
      }}
    >
      <GlassMesh tint="navy" meshOpacity={0.14} glowOpacity={0.24} />
      <div style={{ maxWidth: 'clamp(1100px, 72vw, 1320px)', margin: '0 auto', padding: '0 clamp(20px, 5vw, 60px)', position: 'relative', zIndex: 1 }}>
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <Eyebrow light color={T.cyan}>Track Record</Eyebrow>
          <h2 style={{
            fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(32px, 3vw + 16px, 52px)',
            color: '#fff', margin: '12px 0 0', lineHeight: 1.2,
            letterSpacing: '-0.005em',
          }}>The numbers speak for themselves.</h2>
        </div>

        <TabBar tabs={labels} active={active} onChange={setActive} size="md" light />

        <TabPanel activeKey={active} height={280}>
          {() => (
            <div style={{ textAlign: 'center', padding: '24px 0' }}>
              <div style={{
                fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(96px, 10vw, 176px)',
                color: T.cyan, lineHeight: 1, letterSpacing: '-0.03em',
                margin: '0 0 24px',
              }}>
                {Math.round(displayValue)}<span style={{ fontSize: 'clamp(60px, 6vw, 104px)' }}>{stat.suffix}</span>
              </div>
              <p style={{
                fontFamily: FF.body, fontSize: 'clamp(18px, 0.35vw + 13px, 20px)', lineHeight: 1.55,
                color: 'rgba(255,255,255,0.88)',
                maxWidth: 640, margin: '0 auto',
              }}>{stat.context}</p>
            </div>
          )}
        </TabPanel>

        <div style={{ display: 'flex', justifyContent: 'center', marginTop: 40 }}>
          <SecondaryCTA light onClick={() => navigate('results')}>See full results</SecondaryCTA>
        </div>
      </div>
    </section>
  );
};

// Donut chart card. Each trait gets a 120px ring that draws clockwise from the
// top (0%) to its score, with the numeral centred. Ring background = T.lightGray
// track; foreground = cyan gradient via SVG <defs>. Animation: strokeDashoffset
// counts down from full circumference to (1 - score/100) * circumference on
// inView. Card hover lifts the whole tile + recolours the label to navy.
const TraitRow = ({ trait, index }) => {
  const reduced = usePrefersReducedMotion();
  const [ref, inView] = useInView({ threshold: 0.3, once: true });
  const [hov, setHov] = React.useState(false);

  // Geometry: r=42 inside a 100×100 viewBox → C = 2π·42 ≈ 263.89
  const R = 42;
  const C = 2 * Math.PI * R;
  const offset = inView ? C * (1 - trait.score / 100) : C;
  const gradientId = `trait-grad-${trait.label.toLowerCase()}`;

  return (
    <div
      ref={ref}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: T.surface1,
        borderRadius: T.r3,
        border: `1px solid ${T.border}`,
        padding: '32px 36px',
        boxShadow: hov ? T.shadowPopHover : T.shadowPop,
        transform: reduced
          ? 'perspective(1400px) rotateX(0.4deg)'
          : (hov
              ? 'perspective(1400px) translateY(-4px) translateZ(6px) rotateX(0.4deg)'
              : 'perspective(1400px) translateY(0) translateZ(0) rotateX(0.4deg)'),
        transformStyle: 'preserve-3d',
        transition: reduced ? 'none' : `all ${T.dur2} ${T.ease}`,
        display: 'grid',
        gridTemplateColumns: '120px minmax(0, 1fr)',
        gap: 28, alignItems: 'center',
      }}
    >
      {/* Donut */}
      <div style={{ position: 'relative', width: 120, height: 120 }}>
        <svg
          viewBox="0 0 100 100" width="120" height="120"
          aria-hidden="true"
          style={{ display: 'block', transform: 'rotate(-90deg)' }}
        >
          <defs>
            <linearGradient id={gradientId} x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor={T.cyanDark} />
              <stop offset="100%" stopColor={T.cyan} />
            </linearGradient>
          </defs>
          {/* Background track */}
          <circle
            cx="50" cy="50" r={R}
            fill="none"
            stroke={T.lightGray}
            strokeWidth="10"
          />
          {/* Foreground arc */}
          <circle
            cx="50" cy="50" r={R}
            fill="none"
            stroke={`url(#${gradientId})`}
            strokeWidth="10"
            strokeLinecap="round"
            strokeDasharray={C}
            strokeDashoffset={offset}
            style={{
              transition: reduced ? 'none' : `stroke-dashoffset 1100ms ${T.easeOut} ${index * 90}ms`,
            }}
          />
        </svg>
        {/* Score label inside the ring */}
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexDirection: 'column', gap: 2,
        }}>
          <div style={{
            fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(27px, 1.6vw + 14px, 38px)',
            color: T.white, lineHeight: 1, letterSpacing: '-0.01em',
            textShadow: '0 0 18px rgba(108, 195, 219, 0.22)',
          }}>{trait.score}</div>
          <div style={{
            fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(11px, 0.7vw + 5px, 14px)',
            color: T.inkMuted, letterSpacing: '0.18em', textTransform: 'uppercase',
          }}>/ 100</div>
        </div>
      </div>

      {/* Text */}
      <div>
        <h3 style={{
          fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(20px, 1.4vw + 12px, 26px)',
          color: T.white, margin: '0 0 6px', letterSpacing: '-0.005em',
        }}>{trait.label}</h3>
        <p style={{
          fontFamily: FF.body, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', lineHeight: 1.55,
          color: T.inkMuted, margin: 0,
        }}>{trait.explainer}</p>
      </div>
    </div>
  );
};

// ─── CONSULTATION PAGE (§10.12) ──────────────────────────────────────────────
// Hosts the multi-step consultation flow (§9.8) at full screen — minimal nav,
// no other content competing for attention. Reduces abandonment.

// ─── CONSULTATION FORM (Web3Forms-backed) ────────────────────────────────────
// ⚠️ SETUP REQUIRED: create a FREE access key at https://web3forms.com for
// info@synergy-prep.com (takes ~1 minute — just verify the email), then paste
// the key below. Submissions are emailed to that inbox. No server needed; this
// works on the static GitHub Pages host. Until the key is set, the form shows a
// friendly "not connected yet" notice instead of failing silently.
const WEB3FORMS_ACCESS_KEY = '8dd343cf-97f8-46ca-aca2-82ebcb4a3f5f';

const CONSULT_GRADES   = ['5–6', '7', '8', '9', '10', '11', '12'];
const CONSULT_PROGRAMS = ['SHSAT', 'SAT', 'College Prep', 'Not sure yet'];

const cfFmtPhone = (raw) => {
  const d = raw.replace(/\D/g, '').slice(0, 10);
  if (!d) return '';
  if (d.length < 4) return `(${d}`;
  if (d.length < 7) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
};
const cfIsEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

const ConsultationForm = () => {
  const T = window.T, FF = window.FF;
  const [form, setForm] = React.useState({
    name: '', email: '', phone: '', grade: '', program: '', message: '', botcheck: '',
  });
  const [status, setStatus] = React.useState('idle'); // idle | submitting | success | error
  const [errorMsg, setErrorMsg] = React.useState('');
  const [touched, setTouched] = React.useState(false);

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const nameOk  = form.name.trim().length > 1;
  const emailOk = cfIsEmail(form.email.trim());
  const canSubmit = nameOk && emailOk && status !== 'submitting';

  const submit = async (e) => {
    e.preventDefault();
    setTouched(true);
    if (form.botcheck) return;                 // honeypot tripped — drop silently
    if (!nameOk || !emailOk) return;

    if (!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY === 'YOUR_WEB3FORMS_ACCESS_KEY') {
      setStatus('error');
      setErrorMsg('This form isn’t connected yet. Please call (718) 838-8864 or email info@synergy-prep.com. (Admin: add your Web3Forms access key.)');
      return;
    }

    setStatus('submitting');
    setErrorMsg('');
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: 'New consultation request — Synergy Prep',
          from_name: 'Synergy Prep website',
          name: form.name,
          email: form.email,
          phone: form.phone,
          student_grade: form.grade || '(not specified)',
          program_interest: form.program || '(not specified)',
          message: form.message || '(none)',
        }),
      });
      const data = await res.json();
      if (data.success) {
        setStatus('success');
      } else {
        setStatus('error');
        setErrorMsg(data.message || 'Something went wrong. Please try again, or call (718) 838-8864.');
      }
    } catch (err) {
      setStatus('error');
      setErrorMsg('Network error. Please try again, or call (718) 838-8864.');
    }
  };

  const labelStyle = {
    display: 'block', fontFamily: FF.ui, fontWeight: 600,
    fontSize: 'clamp(13px, 0.7vw + 7px, 14px)', color: T.white, marginBottom: 6,
  };
  const fieldStyle = (invalid) => ({
    width: '100%', boxSizing: 'border-box',
    fontFamily: FF.body, fontSize: 'clamp(15px, 0.3vw + 11px, 16px)',
    color: T.ink, background: T.surface2,
    border: `1px solid ${invalid ? T.warning : T.border}`,
    borderRadius: T.r1, padding: '12px 14px', outline: 'none',
    transition: `border-color ${T.dur1} ${T.ease}`,
  });
  const focusOn  = (e) => { e.target.style.borderColor = T.cyan; };
  const focusOff = (e, invalid) => { e.target.style.borderColor = invalid ? T.warning : T.border; };

  // ── Success state ──────────────────────────────────────────────────────────
  if (status === 'success') {
    return (
      <div style={{
        background: T.surface1, border: `1px solid ${T.border}`, borderRadius: T.r3,
        padding: 'clamp(32px, 5vw, 56px)', textAlign: 'center',
      }}>
        <div aria-hidden="true" style={{
          width: 64, height: 64, borderRadius: '50%', background: T.success,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          color: '#fff', fontSize: 32, marginBottom: 20,
        }}>✓</div>
        <h2 style={{
          fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(24px, 1.6vw + 14px, 32px)',
          color: T.white, margin: '0 0 12px',
        }}>Thanks — we’ve got it.</h2>
        <p style={{
          fontFamily: FF.body, fontSize: 'clamp(16px, 0.3vw + 12px, 18px)', color: T.inkMuted,
          margin: '0 auto', maxWidth: 420, lineHeight: 1.55,
        }}>A Synergy Prep advisor will reach out within 1 business day. Prefer to talk now? Call{' '}
          <a href="tel:+17188388864" style={{ color: T.interactive, fontWeight: 600 }}>(718) 838-8864</a>.
        </p>
      </div>
    );
  }

  // ── Form ─────────────────────────────────────────────────────────────────────
  return (
    <form
      onSubmit={submit}
      noValidate
      style={{
        background: T.surface1, border: `1px solid ${T.border}`, borderRadius: T.r3,
        padding: 'clamp(24px, 4vw, 40px)',
        display: 'flex', flexDirection: 'column', gap: 18,
      }}
    >
      {/* Honeypot — hidden from humans, catches bots */}
      <input
        type="text" name="botcheck" tabIndex={-1} autoComplete="off"
        value={form.botcheck} onChange={(e) => set('botcheck', e.target.value)}
        style={{ position: 'absolute', left: '-9999px', width: 1, height: 1, opacity: 0 }}
        aria-hidden="true"
      />

      <div>
        <label htmlFor="cf-name" style={labelStyle}>Parent / guardian name <span style={{ color: T.cyan }}>*</span></label>
        <input
          id="cf-name" type="text" autoComplete="name" value={form.name}
          onChange={(e) => set('name', e.target.value)}
          onFocus={focusOn} onBlur={(e) => focusOff(e, touched && !nameOk)}
          style={fieldStyle(touched && !nameOk)} placeholder="Your name"
        />
        {touched && !nameOk && <FieldError>Please enter your name.</FieldError>}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 18 }}>
        <div>
          <label htmlFor="cf-email" style={labelStyle}>Email <span style={{ color: T.cyan }}>*</span></label>
          <input
            id="cf-email" type="email" autoComplete="email" value={form.email}
            onChange={(e) => set('email', e.target.value)}
            onFocus={focusOn} onBlur={(e) => focusOff(e, touched && !emailOk)}
            style={fieldStyle(touched && !emailOk)} placeholder="you@example.com"
          />
          {touched && !emailOk && <FieldError>Enter a valid email.</FieldError>}
        </div>
        <div>
          <label htmlFor="cf-phone" style={labelStyle}>Phone <span style={{ color: T.inkMuted, fontWeight: 400 }}>(optional)</span></label>
          <input
            id="cf-phone" type="tel" autoComplete="tel" value={form.phone}
            onChange={(e) => set('phone', cfFmtPhone(e.target.value))}
            onFocus={focusOn} onBlur={(e) => focusOff(e, false)}
            style={fieldStyle(false)} placeholder="(718) 555-0123"
          />
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 18 }}>
        <div>
          <label htmlFor="cf-grade" style={labelStyle}>Student’s grade</label>
          <select
            id="cf-grade" value={form.grade} onChange={(e) => set('grade', e.target.value)}
            onFocus={focusOn} onBlur={(e) => focusOff(e, false)} style={fieldStyle(false)}
          >
            <option value="">Select a grade</option>
            {CONSULT_GRADES.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
        </div>
        <div>
          <label htmlFor="cf-program" style={labelStyle}>Program of interest</label>
          <select
            id="cf-program" value={form.program} onChange={(e) => set('program', e.target.value)}
            onFocus={focusOn} onBlur={(e) => focusOff(e, false)} style={fieldStyle(false)}
          >
            <option value="">Select a program</option>
            {CONSULT_PROGRAMS.map((p) => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
      </div>

      <div>
        <label htmlFor="cf-message" style={labelStyle}>Anything we should know? <span style={{ color: T.inkMuted, fontWeight: 400 }}>(optional)</span></label>
        <textarea
          id="cf-message" rows={4} value={form.message}
          onChange={(e) => set('message', e.target.value)}
          onFocus={focusOn} onBlur={(e) => focusOff(e, false)}
          style={{ ...fieldStyle(false), resize: 'vertical', minHeight: 96 }}
          placeholder="Goals, timeline, target schools, scheduling notes…"
        />
      </div>

      {status === 'error' && (
        <div role="alert" style={{
          fontFamily: FF.body, fontSize: 'clamp(14px, 0.3vw + 10px, 15px)',
          color: T.warning, background: 'rgba(231,139,48,0.10)',
          border: `1px solid ${T.warning}`, borderRadius: T.r1, padding: '10px 14px',
        }}>{errorMsg}</div>
      )}

      <button
        type="submit" disabled={!canSubmit}
        style={{
          width: '100%', height: 56, borderRadius: T.r1, border: 'none',
          fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)',
          letterSpacing: '0.06em', textTransform: 'uppercase',
          color: T.goldText, background: canSubmit ? T.mint : T.borderDark,
          cursor: canSubmit ? 'pointer' : 'not-allowed',
          transition: `background ${T.dur1} ${T.ease}`,
        }}
      >{status === 'submitting' ? 'Sending…' : 'Book My Free Consult'}</button>

      <p style={{
        fontFamily: FF.body, fontSize: 'clamp(13px, 0.3vw + 9px, 14px)', color: T.inkMuted,
        textAlign: 'center', margin: 0, lineHeight: 1.5,
      }}>No obligation. Your info is private. We respond within 1 business day.</p>
    </form>
  );
};

// ─── ROTATING TRUST STRIP ───────────────────────────────────────────────────
// Sidebar testimonial that cycles through a pool every ~17s. Cross-fades
// between quotes, pauses on hover, and shows a thin progress bar so the
// user has a sense of when the next one arrives. Bottom of the card carries
// the dot indicators + the "Featured in The Bronx Times" pill that was on
// the static version.
const RotatingTrustStrip = ({ testimonials, intervalMs = 17000 }) => {
  const T = window.T, FF = window.FF;
  const reduced = window.usePrefersReducedMotion();
  const [idx, setIdx] = React.useState(0);
  const [paused, setPaused] = React.useState(false);
  const [fadeState, setFadeState] = React.useState('in'); // 'in' | 'out'

  // Cycle index every interval, with a brief fade-out before each swap.
  React.useEffect(() => {
    if (paused || reduced) return;
    if (testimonials.length <= 1) return;
    const advance = setInterval(() => {
      setFadeState('out');
      setTimeout(() => {
        setIdx((i) => (i + 1) % testimonials.length);
        setFadeState('in');
      }, 320); // matches the fade-out transition
    }, intervalMs);
    return () => clearInterval(advance);
  }, [paused, reduced, testimonials.length, intervalMs]);

  const goto = (i) => {
    if (i === idx) return;
    setFadeState('out');
    setTimeout(() => { setIdx(i); setFadeState('in'); }, 320);
  };

  const current = testimonials[idx];

  return (
    <div
      onMouseEnter={() => setPaused(true)}
      onMouseLeave={() => setPaused(false)}
      style={{
        background: T.surface1, borderRadius: T.r3,
        border: `1px solid ${T.border}`, padding: 24,
        display: 'flex', flexDirection: 'column', gap: 16,
        position: 'relative', overflow: 'hidden',
      }}
    >
      {/* Header label */}
      <div style={{
        fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(12px, 0.7vw + 6px, 14px)',
        color: T.cyanDark, letterSpacing: '0.12em', textTransform: 'uppercase',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        gap: 8,
      }}>
        <span>What parents say</span>
        {paused && !reduced && (
          <span style={{
            fontSize: 'clamp(12px, 0.7vw + 6px, 14px)', color: T.inkMuted, fontWeight: 500,
            textTransform: 'none', letterSpacing: '0.02em',
          }}>paused</span>
        )}
      </div>

      {/* The actual quote — cross-fades on rotate */}
      <div
        aria-live="polite"
        style={{
          minHeight: 140,
          opacity: fadeState === 'in' ? 1 : 0,
          transform: fadeState === 'in' ? 'translateY(0)' : 'translateY(6px)',
          transition: reduced
            ? 'none'
            : `opacity 320ms ${T.ease}, transform 320ms ${T.ease}`,
        }}
      >
        {/* Cyan quotation mark accent */}
        <div aria-hidden="true" style={{
          fontFamily: FF.heading, fontWeight: 700, fontSize: 'clamp(30px, 2vw + 15px, 44px)',
          color: T.cyan, lineHeight: 1, marginBottom: -8,
        }}>“</div>
        <p style={{
          fontFamily: FF.body, fontStyle: 'italic', fontSize: 'clamp(15px, 0.3vw + 11px, 17px)',
          color: T.ink, lineHeight: 1.55, margin: '0 0 12px',
        }}>{current.quote}</p>
        <div style={{ fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(13px, 0.7vw + 7px, 14px)', color: T.white }}>
          {current.name}{' '}
          <span style={{ color: T.inkMuted, fontWeight: 400 }}>· {current.role}</span>
        </div>
      </div>

      {/* Progress bar — fills over the interval, resets on rotate */}
      {!reduced && testimonials.length > 1 && (
        <div style={{
          height: 2, borderRadius: 1, background: T.border, overflow: 'hidden',
          marginTop: -4,
        }}>
          <div
            key={`${idx}-${paused}`}
            style={{
              height: '100%', background: T.cyan, width: paused ? '100%' : '0%',
              animation: paused ? 'none' : `sp-trust-fill ${intervalMs}ms linear forwards`,
              transformOrigin: 'left',
            }}
          />
        </div>
      )}

      {/* Dot indicators — clickable, jump to any testimonial */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: 6, flexWrap: 'wrap' }}>
        {testimonials.map((_, i) => (
          <button
            key={i}
            onClick={() => goto(i)}
            aria-label={`Show testimonial ${i + 1} of ${testimonials.length}`}
            aria-current={i === idx}
            style={{
              width: i === idx ? 18 : 6, height: 6, borderRadius: 3,
              background: i === idx ? T.cyan : T.borderDark,
              border: 'none', cursor: 'pointer', padding: 0,
              transition: reduced ? 'none' : `all ${T.dur2} ${T.ease}`,
            }}
          />
        ))}
      </div>

      {/* Featured pill — unchanged from the static version */}
      <div style={{
        marginTop: 4, padding: '10px 14px',
        background: T.glow, borderRadius: T.r1,
        fontFamily: FF.ui, fontSize: 'clamp(12px, 0.7vw + 6px, 14px)', fontWeight: 600,
        color: T.white, letterSpacing: '0.12em', textTransform: 'uppercase',
        textAlign: 'center',
      }}>Featured in The Bronx Times</div>

      {/* Progress-bar keyframe */}
      <style>{`@keyframes sp-trust-fill { from { width: 0% } to { width: 100% } }`}</style>
    </div>
  );
};

// ─── STICKY MOBILE CTA BAR (§10.1) ──────────────────────────────────────────
// Appears on mobile after scrolling past hero, on Home and Programs pages.
// Slides up over 240ms; hides on scroll-up.
const StickyMobileCTA = ({ navigate, enabled = false }) => {
  const [show, setShow] = React.useState(false);
  const [scrollDir, setScrollDir] = React.useState('down');
  const lastY = React.useRef(0);

  React.useEffect(() => {
    if (!enabled) { setShow(false); return; }
    if (typeof window === 'undefined' || window.innerWidth >= 1024) return;
    const onScroll = () => {
      const y = window.scrollY;
      const dir = y > lastY.current ? 'down' : 'up';
      lastY.current = y;
      setScrollDir(dir);
      setShow(y > 600 && dir === 'down');
    };
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, [enabled]);

  if (!enabled) return null;

  return (
    <div
      aria-hidden={!show}
      style={{
        position: 'fixed', bottom: 0, left: 0, right: 0,
        background: T.cyan, color: T.goldText,
        height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(15px, 0.3vw + 11px, 17px)',
        cursor: 'pointer', letterSpacing: '0.01em',
        boxShadow: '0 -4px 16px rgba(8, 33, 61,0.18)',
        transform: show ? 'translateY(0)' : 'translateY(100%)',
        transition: `transform ${T.dur2} ${T.easeOut}`,
        zIndex: T.zSticky,
      }}
      onClick={() => navigate('consultation')}
      role="button" tabIndex={show ? 0 : -1}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') navigate('consultation'); }}
    >Book My Free Consult</div>
  );
};

// ─── ENVIRONMENT GUARD ────────────────────────────────────────────────────────
// Gates dev-only surfaces (TweaksPanel + ChatBot) out of the production render
// path. On any of these hosts the dev UI stays on:
//   - empty string  (file:// open)
//   - localhost / 127.0.0.1 / 0.0.0.0
//   - *.local / *.localhost mDNS hosts
//   - any URL with `?dev=1` (or `?dev`) in the query string
// Anywhere else (e.g. synergy-prep.com) → production → dev UI is hidden.
const IS_DEV_ENV = (() => {
  if (typeof window === 'undefined') return false;
  const h = (window.location.hostname || '').toLowerCase();
  if (h === '' || h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') return true;
  if (h.endsWith('.local') || h.endsWith('.localhost')) return true;
  try {
    if (new URLSearchParams(window.location.search).has('dev')) return true;
  } catch (_) { /* malformed query string, ignore */ }
  return false;
})();

// Build the JSON-LD array for a given route.
const buildSchema = (page) => {
  const list = [ORG_BASE];
  if (page === 'home' || page === 'about') list.push(LOCAL_BUSINESS);
  const faqs = FAQ_BY_PAGE[page];
  if (faqs && faqs.length) {
    list.push({
      '@type': 'FAQPage',
      'mainEntity': faqs.map(({ q, a }) => ({
        '@type': 'Question',
        'name': q,
        'acceptedAnswer': { '@type': 'Answer', 'text': a },
      })),
    });
  }
  return {
    '@context': 'https://schema.org',
    '@graph': list,
  };
};

const applySchema = (page) => {
  if (typeof document === 'undefined') return;
  let el = document.getElementById('sp-jsonld');
  if (!el) {
    el = document.createElement('script');
    el.id = 'sp-jsonld';
    el.type = 'application/ld+json';
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(buildSchema(page));
};

// Apply the meta block for a given route. Creates missing tags on first call.
const applyPageMeta = (page) => {
  if (typeof document === 'undefined') return;
  const meta = PAGE_META[page] || PAGE_META.home;
  const url  = `${SITE_URL}/${page === 'home' ? '' : page}`;

  document.title = meta.title;

  const setMeta = (selector, attr, content) => {
    let el = document.querySelector(selector);
    if (!el) {
      el = document.createElement('meta');
      const [k, v] = selector.replace(/[\[\]"]/g, '').split('=');
      el.setAttribute(k, v);
      document.head.appendChild(el);
    }
    el.setAttribute(attr, content);
  };
  const setLink = (rel, href) => {
    let el = document.querySelector(`link[rel="${rel}"]`);
    if (!el) {
      el = document.createElement('link');
      el.setAttribute('rel', rel);
      document.head.appendChild(el);
    }
    el.setAttribute('href', href);
  };

  setMeta('meta[name="description"]',  'content', meta.desc);
  setLink('canonical', url);

  // Open Graph (Facebook, LinkedIn, iMessage)
  setMeta('meta[property="og:title"]',       'content', meta.title);
  setMeta('meta[property="og:description"]', 'content', meta.desc);
  setMeta('meta[property="og:url"]',         'content', url);
  setMeta('meta[property="og:type"]',        'content', 'website');
  setMeta('meta[property="og:image"]',       'content', OG_IMAGE);
  setMeta('meta[property="og:site_name"]',   'content', SITE_NAME);

  // Twitter Card
  setMeta('meta[name="twitter:card"]',        'content', 'summary_large_image');
  setMeta('meta[name="twitter:title"]',       'content', meta.title);
  setMeta('meta[name="twitter:description"]', 'content', meta.desc);
  setMeta('meta[name="twitter:image"]',       'content', OG_IMAGE);
};

// ─── CONVERSION TRACKING (2.2 — P0) ──────────────────────────────────────────
// GA4 fired zero key events before this pass (handoff §1). track() is the
// single bridge: it uses gtag when the GA4 snippet is present (see the
// SP_GA_MEASUREMENT_ID block in the bundle <head>), otherwise it queues into
// dataLayer so events are never lost. Event names wired across the build:
//   consult_cta_click · consult_submit · diagnostic_start ·
//   diagnostic_complete · calculator_used · calculator_plan_click ·
//   phone_click · newsletter_submit
// TODO(syed): mark all eight as key events in GA4 Admin, and add the bot
// filter + NYC-region segment from handoff §1.
const track = (event, params = {}) => {
  try {
    if (typeof window.gtag === 'function') {
      window.gtag('event', event, params);
    } else {
      (window.dataLayer = window.dataLayer || []).push({ event, ...params });
    }
    if (IS_DEV_ENV && window.console) console.info('[track]', event, params);
  } catch (_) { /* analytics must never break the UI */ }
};
window.SP_TRACK = track;

// ─── MAIN APP (2.1) ───────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState('home');
  const [pageParams, setPageParams] = React.useState({});
  const [tweaks, setTweaksState] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  const setTweak = (key, value) => {
    const next = typeof key === 'object' ? { ...tweaks, ...key } : { ...tweaks, [key]: value };
    setTweaksState(next);
    if (window.parent !== window) {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
    }
  };

  // Edit-mode handshake — wires the TweaksPanel up to a parent CMS / preview
  // frame via postMessage. Dev only. In production this effect is a no-op so
  // the message listener never even registers.
  React.useEffect(() => {
    if (!IS_DEV_ENV) return;
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    if (window.parent !== window) {
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    }
    return () => window.removeEventListener('message', handler);
  }, []);

  // Hash routing — runs everywhere (prod + dev). Reads #page on mount and
  // listens for #page changes so deep links and back/forward nav work.
  React.useEffect(() => {
    const readHash = () => {
      const h = window.location.hash.replace('#', '');
      if (h) setPage(h);
    };
    readHash();
    window.addEventListener('hashchange', readHash);
    return () => window.removeEventListener('hashchange', readHash);
  }, []);

  const navigate = (p, params = {}) => {
    // P0: every consult CTA in the build routes here, so this one hook
    // captures consult_cta_click site-wide with the source page attached.
    // from_page reads the live hash (not closure state) because modules can
    // hold a stale navigate reference via window.SP_NAVIGATE.
    const fromPage = window.location.hash.replace('#', '') || 'home';
    if (p === 'consultation' && fromPage !== 'consultation') {
      track('consult_cta_click', { from_page: fromPage, ...(params.source ? { source: params.source } : {}) });
    }
    setPage(p);
    setPageParams(params);
    window.location.hash = p;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Expose globally so modules without prop access can route
  React.useEffect(() => { window.SP_NAVIGATE = navigate; }, []);

  // P0: delegated listener — one handler tracks every tel: link on the site
  // (nav, hero, footer, consult page) without touching each anchor.
  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href^="tel:"]');
      if (a) track('phone_click', { from_page: window.location.hash.replace('#', '') || 'home' });
    };
    document.addEventListener('click', onClick, true);
    return () => document.removeEventListener('click', onClick, true);
  }, []);

  // Per-route SEO meta: title, description, canonical, Open Graph, Twitter.
  // Plus the matching JSON-LD schema (Organization + LocalBusiness on
  // home/about, FAQPage on pages with FAQ accordions).
  React.useEffect(() => {
    applyPageMeta(page);
    applySchema(page);
  }, [page]);

  const pageProps = { navigate, params: pageParams };

  // Consultation page renders standalone (its own minimal nav, no global Nav/Footer).
  const isConsultPage = page === 'consultation';

  // Sticky mobile CTA only on Home and Programs Hub (§10.1)
  const showStickyMobileCTA = page === 'home' || page === 'programs-hub';

  return (
    <div style={{ minHeight: '100vh', background: '#fff', fontFamily: FF.body }}>
      {/* Section-flow globals — appear on every page except the consult form.
          ScrollProgress: top-left 0→100% counter on desktop, 2px cyan bar on
          mobile. ChapterMarker: left-edge "01 / FIND YOUR FIT" label on
          desktop only. Both skip themselves under reduced motion. */}
      {!isConsultPage && window.ScrollProgress && <window.ScrollProgress />}
      {!isConsultPage && window.ChapterMarker  && <window.ChapterMarker  />}

      {/* ClickRipple + FountainPenCursor removed entirely (HI6, conversion
          audit pass 1), the ripple's pixelated edges at large scales and
          the custom cursor were reverted in a prior session and they sat as
          dead code afterward. */}

      {/* Site-wide glassy backdrop — fixed layer behind content, gives the
          whole site a subtle refractive feel. */}
      {window.PageGlass && <window.PageGlass />}

      <Nav currentPage={page} navigate={navigate} />

      <main>
        {page === 'home'           && <HomePage {...pageProps} />}
        {page === 'programs-hub'   && <ProgramsHubPage {...pageProps} />}
        {page === 'shsat'          && <SHSATPageV2 {...pageProps} />}
        {page === 'sat'            && <SATPageV2 {...pageProps} />}
        {page === 'college'        && <CollegePageV2 {...pageProps} />}
        {page === 'about'          && <AboutPage {...pageProps} />}
        {page === 'tutors'         && <TutorsPage {...pageProps} />}
        {page === 'results'        && <ResultsPage {...pageProps} />}
        {page === 'resources'      && <ResourcesPage {...pageProps} />}
        {page === 'consultation'   && <ConsultationPage {...pageProps} />}
        {/* Back-compat redirects from v2.0 page slugs */}
        {page === 'contact'        && <ConsultationPage {...pageProps} />}
        {page === 'success'        && <ResultsPage {...pageProps} />}
        {/* Decommissioned routes (still in the URL hash sometimes) — fall back */}
        {page === 'how-it-works'   && <AboutPage {...pageProps} />}
        {page === 'subjects'       && <ProgramsHubPage {...pageProps} />}
      </main>

      <Footer navigate={navigate} />

      <StickyMobileCTA navigate={navigate} enabled={showStickyMobileCTA && !isConsultPage} />

      {/* Synergy Assistant — guided FAQ chatbot. Dev only for now (gated on
          IS_DEV_ENV), kept out of the production render path until the FAQ
          bank + intake handoff are signed off. Mounted everywhere except the
          consultation page (which has its own focused intake flow). */}
      {IS_DEV_ENV && !isConsultPage && <ChatBot />}

      {/* TweaksPanel — dev-only CMS / preview editor. The IS_DEV_ENV gate is
          belt-and-suspenders: the postMessage listener that flips
          `tweaksVisible` true is already dev-only above, but this render
          gate guarantees no production user can land in a state where the
          panel paints (e.g. via a stale `tweaksVisible: true` in some
          future serialized state). */}
      {IS_DEV_ENV && tweaksVisible && (
        <TweaksPanel onClose={() => {
          setTweaksVisible(false);
          if (window.parent !== window) {
            window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
          }
        }}>
          <TweakSection title="Brand Colors">
            <TweakColor label="Navy (Primary)" value={tweaks.navyColor} onChange={v => setTweak('navyColor', v)} />
            <TweakColor label="Cyan (Accent)" value={tweaks.cyanColor} onChange={v => setTweak('cyanColor', v)} />
          </TweakSection>
          <TweakSection title="Navigate Pages">
            {[
              ['home',         'Home'],
              ['programs-hub', 'Programs Hub'],
              ['shsat',        'SHSAT'],
              ['sat',          'SAT'],
              ['college',      'College Prep'],
              ['about',        'About Us'],
              ['tutors',       'Tutors'],
              ['results',      'Results'],
              ['resources',    'Resources'],
              ['consultation', 'Book My Free Consult'],
            ].map(([p, label]) => (
              <TweakButton key={p} label={label} onClick={() => navigate(p)} />
            ))}
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
};
