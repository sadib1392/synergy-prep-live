// ─── SHARED HOOKS (2.1) ──────────────────────────────────────────────────────
// Live subscription to user's reduced-motion OS setting.
// All Tier 2/3 animations must consult this and provide a fallback per BRIEF §8.
const usePrefersReducedMotion = () => {
  const [reduced, setReduced] = React.useState(false);
  React.useEffect(() => {
    if (typeof window === 'undefined' || !window.matchMedia) return;
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReduced(mq.matches);
    const onChange = (e) => setReduced(e.matches);
    // Safari < 14 used addListener; modern browsers use addEventListener.
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else mq.addListener(onChange);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', onChange);
      else mq.removeListener(onChange);
    };
  }, []);
  return reduced;
};

// Returns [ref, inView]. Attach ref to the element you want to track.
// Default: fires once at 20% visibility — matches BRIEF §8 Tier 2 spec for
// reveal motion. Set { once: false } for elements that should re-animate on
// re-entry (rare; counters and pathway are single-fire by spec).
const useInView = ({ threshold = 0.2, once = true, rootMargin = '0px' } = {}) => {
  const ref = React.useRef(null);
  const [inView, setInView] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Graceful fallback if IntersectionObserver is missing — render as if in view
    // so the page is never empty.
    if (typeof IntersectionObserver === 'undefined') { setInView(true); return; }
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          if (once) obs.disconnect();
        } else if (!once) {
          setInView(false);
        }
      },
      { threshold, rootMargin }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold, once, rootMargin]);
  return [ref, inView];
};

// ─── GLOBAL BASELINE STYLES (injected once on module load) ───────────────────
// Two site-wide accessibility rules per BRIEF §8 & §12:
//   1. Visible 3px cyan focus ring on keyboard focus (never silent outline:none).
//   2. Cap all CSS transitions/animations when prefers-reduced-motion is set.
// Scoped via :focus-visible so click/tap doesn't ring; per-component focus
// overrides still win on specificity. Injected here (not in styles.css) so the
// JSX standalone build inherits them without an external file.
(() => {
  if (typeof document === 'undefined') return;
  if (document.getElementById('synergy-baseline-styles')) return;
  const el = document.createElement('style');
  el.id = 'synergy-baseline-styles';
  el.textContent = `
    *:focus-visible {
      outline: 3px solid ${T.navy};
      outline-offset: 2px;
      border-radius: 2px;
      box-shadow: 0 0 0 5px rgba(108, 195, 219, 0.35);
    }
    /* Section-child fade-up on scroll-into-view. The Section component sets
       data-sp-in="1" once its top crosses the threshold; CSS then transitions
       the direct content children up into place with a stagger by nth-child. */
    [data-sp-section][data-sp-in="0"] > [data-sp-section-inner] > * {
      opacity: 0;
      transform: translateY(24px);
    }
    [data-sp-section] > [data-sp-section-inner] > * {
      transition: opacity ${T.dur3} ${T.ease}, transform ${T.dur3} ${T.ease};
    }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > * {
      opacity: 1;
      transform: translateY(0);
    }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(1) { transition-delay: 0ms; }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(2) { transition-delay: 100ms; }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(3) { transition-delay: 200ms; }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(4) { transition-delay: 300ms; }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(5) { transition-delay: 400ms; }
    [data-sp-section][data-sp-in="1"] > [data-sp-section-inner] > *:nth-child(n+6) { transition-delay: 500ms; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 150ms !important;
        scroll-behavior: auto !important;
      }
      /* Reveal everything immediately under reduced motion. */
      [data-sp-section] > [data-sp-section-inner] > * {
        opacity: 1 !important;
        transform: none !important;
      }
    }
    /* ── Responsive layout utilities (2026-06-10 viewport pass) ─────────────
       Inline styles can't carry media queries, so the handful of fixed
       multi-column grids use these classes instead. Desktop layout is
       identical to the previous inline values; below the breakpoint each
       collapses to a single column. */
    .sp-hero-grid    { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr); }
    /* Home hero height: above-the-fold cap on desktop, natural height on
       mobile where the stacked content is taller than the viewport. */
    .sp-hero-cap     { min-height: max(560px, calc(100vh - 96px)); max-height: calc(100vh - 81px); }
    @media (max-width: 900px) {
      .sp-hero-cap   { min-height: 0; max-height: none; }
    }
    .sp-2col         { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .sp-split-4060   { display: grid; grid-template-columns: minmax(0, 40fr) minmax(0, 60fr); }
    .sp-calc-grid    { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .sp-2col-tight   { display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 900px) {
      .sp-hero-grid  { grid-template-columns: minmax(0, 1fr); }
      .sp-split-4060 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 840px) {
      .sp-2col       { grid-template-columns: minmax(0, 1fr); gap: 40px !important; }
    }
    @media (max-width: 768px) {
      .sp-calc-grid  { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 440px) {
      .sp-2col-tight { grid-template-columns: 1fr; }
    }
  `;
  document.head.appendChild(el);
})();

  if (e.includes('what families say') || e.includes('testimonial'))      return 'results_what_families_say';

  // Locations / contact — no matching SVG, fall through to SiteIcon
  if (e.includes('location') || e.includes('visit us'))                  return null;

  return null;
};

const inferIconFromEyebrow = (eyebrow) => {
  if (!eyebrow) return 'foundation';
  const e = eyebrow.toLowerCase();
  // Order matters — more specific matches first.
  if (e.includes('what\'s new') || e.includes('fall 2026') || e.includes('digital format')) return 'diagnostic';
  if (e.includes('what you get'))                                       return 'free-consult';
  if (e.includes('what\'s covered') || e.includes('covered'))           return 'learning-plan';
  if (e.includes('score goal') || e.includes('goal'))                   return 'student-momentum';
  if (e.includes('cohort'))                                             return 'specialized-offers';
  if (e.includes('the full record') || e.includes('year by year'))      return 'progress-report';
  if (e.includes('offer'))                                              return 'specialized-offers';
  if (e.includes('student stor') || e.includes('spotlight'))            return 'student-momentum';
  if (e.includes('how synergy') || e.includes('the synergy method') || e.includes('method')) return 'learning-plan';
  if (e.includes('our programs') || e.includes('all four tracks') || e.includes('track')) return 'resources';
  if (e.includes('track record') || e.includes('by the numbers') || e.includes('result')) return 'results';
  if (e.includes('meet') || e.includes('tutor') || e.includes('team') || e.includes('your team')) return 'tutor-match';
  if (e.includes('parent faq') || e.includes('question') || e.includes('faq')) return 'reviews';
  if (e.includes('how you\'ll know') || e.includes('what you receive') || e.includes('progress')) return 'progress-report';
  if (e.includes('why synergy') || e.includes('three pillar'))          return 'confidence';
  if (e.includes('families') || e.includes('what families say') || e.includes('review')) return 'reviews';
  if (e.includes('where our students go') || e.includes('students go') || e.includes('placement')) return 'specialized-offers';
  if (e.includes('compare'))                                            return 'scholarship';
  if (e.includes('where families start') || e.includes('start'))        return 'diagnostic';
  if (e.includes('session') || e.includes('format'))                    return 'one-on-one';
  if (e.includes('expect'))                                             return 'free-consult';
  if (e.includes('subject'))                                            return 'resources';
  if (e.includes('pick'))                                               return 'diagnostic';
  if (e.includes('newsletter'))                                         return 'free-consult';
  if (e.includes('featured') || e.includes('article') || e.includes('resource')) return 'resources';
  if (e.includes('filter') || e.includes('our standard'))               return 'tutor-match';
  if (e.includes('free consult'))                                        return 'free-consult';
  return 'foundation';
};

// Renders the animated icon block above a section title.
//   - If a brand PNG icon key is available, render that (richer art).
//   - Else fall back to the SVG SiteIcon system.
// Plays a scale+rotate bounce on entry; the PNG variant also adds a subtle
// continuous floaty bob to add life without being distracting.
//
// Mounts a small keyframe stylesheet on first use (idempotent — id-guarded).
const ensureHeadingIconStyles = () => {
  if (typeof document === 'undefined') return;
  if (document.getElementById('sp-heading-icon-styles')) return;
  const el = document.createElement('style');
  el.id = 'sp-heading-icon-styles';
  el.textContent = `
    @keyframes sp-heading-icon-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    .sp-heading-icon-floating { animation: sp-heading-icon-float 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .sp-heading-icon-floating { animation: none !important; }
    }
  `;
  document.head.appendChild(el);
};

const SectionHeaderIcon = ({ slug, headingIconKey, eyebrow, light, inView, reduced }) => {
  React.useEffect(() => { ensureHeadingIconStyles(); }, []);

  // Opt-out: headingIcon="none" renders no icon (and suppresses the eyebrow
  // inference fallback) for sections that read better without one.
  if (headingIconKey === 'none') return null;

  // Prefer the explicit headingIconKey prop, else look one up from the
  // eyebrow text, else null (= fall back to SVG SiteIcon).
  const resolvedKey = headingIconKey
    || (eyebrow ? inferHeadingIconKey(eyebrow) : null);
  const pngSrc = resolvedKey && window.HEADING_ICONS ? window.HEADING_ICONS[resolvedKey] : null;
  const hasPng = !!pngSrc;

  // Brand PNG icons are taller-than-wide and look better at a larger size
  // without a colored background plate — the artwork itself carries the look.
  const containerSize = hasPng ? 96 : 64;
  const innerSize     = hasPng ? 92 : 40;
  const bg = hasPng
    ? 'transparent'
    : (light ? 'rgba(255,255,255,0.10)' : 'rgba(111, 197, 219, 0.16)');
  const border = hasPng
    ? 'transparent'
    : (light ? 'rgba(255,255,255,0.20)' : 'rgba(111, 197, 219, 0.30)');

  return (
    <div
      aria-hidden="true"
      style={{
        width: containerSize, height: containerSize,
        margin: '0 auto 20px',
        background: bg,
        border: `1px solid ${border}`,
        borderRadius: hasPng ? 0 : 14,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        opacity: inView ? 1 : 0,
        transform: inView ? 'scale(1) rotate(0deg)' : 'scale(0.55) rotate(-12deg)',
        transition: reduced
          ? 'none'
          : `opacity 500ms ${T.easeOut}, transform 600ms ${T.easeBounce}`,
        position: 'relative',
      }}
    >
      {/* Soft cyan glow that fades in slightly after the icon settles. Only
          on light backgrounds, on dark hero sections the glow gets lost. */}
      {!light && (
        <div aria-hidden="true" style={{
          position: 'absolute', inset: hasPng ? -12 : -8,
          borderRadius: hasPng ? '50%' : 22,
          background: `radial-gradient(circle, rgba(108, 195, 219,${hasPng ? 0.18 : 0.25}) 0%, rgba(108, 195, 219,0) 70%)`,
          opacity: inView ? 1 : 0,
          transition: reduced ? 'none' : `opacity 800ms ${T.ease} 300ms`,
          pointerEvents: 'none', zIndex: -1,
        }} />
      )}
      {hasPng ? (
        <img
          src={pngSrc}
          alt=""
          aria-hidden="true"
          className={inView && !reduced ? 'sp-heading-icon-floating' : ''}
          style={{
            width: innerSize, height: innerSize,
            objectFit: 'contain',
            display: 'block',
          }}
        />
      ) : (
        window.SiteIcon ? <window.SiteIcon slug={slug} size={innerSize} /> : null
      )}
    </div>
  );
};

const SectionHeader = ({ eyebrow, title, subhead, light = false, align = 'center', maxWidth = 720, icon, headingIcon }) => {
  const [ref, inView] = useInView({ threshold: 0.2, once: true });
  const reduced = usePrefersReducedMotion();
  const resolvedIcon = icon || inferIconFromEyebrow(eyebrow);

  const fadeStyle = (delayMs) => ({
    opacity: inView ? 1 : 0,
    transform: inView ? 'translateY(0)' : 'translateY(12px)',
    transition: reduced
      ? 'none'
      : `opacity 600ms ${T.ease} ${delayMs}ms, transform 600ms ${T.ease} ${delayMs}ms`,
  });

  return (
    <div
      ref={ref}
      style={{
        textAlign: align,
        maxWidth: align === 'center' ? maxWidth : 'none',
        margin: align === 'center' ? '0 auto 56px' : '0 0 56px',
      }}
    >
      <SectionHeaderIcon
        slug={resolvedIcon}
        headingIconKey={headingIcon}
        eyebrow={eyebrow}
        light={light}
        inView={inView}
        reduced={reduced}
      />
      <h2 style={{
        fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(32px, 3vw + 16px, 52px)',
        letterSpacing: '-0.005em', lineHeight: 1.2,
        color: '#fff', margin: 0,
        ...fadeStyle(180),
      }}>{title}</h2>
      {/* Booklet signature: short flat accent rule under every heading
          (both booklets run a small mint dash beneath their H2s). */}
      <div aria-hidden="true" style={{
        width: 56, height: 3, background: T.mint,
        margin: align === 'center' ? '20px auto 0' : '20px 0 0',
        ...fadeStyle(260),
      }} />
      {subhead && (
        <p style={{
          fontFamily: FF.body, fontSize: 'clamp(18px, 0.35vw + 13px, 20px)', lineHeight: 1.55,
          color: light ? 'rgba(255,255,255,0.8)' : T.inkMuted,
          margin: '16px auto 0', maxWidth: 720,
          ...fadeStyle(320),
        }}>{subhead}</p>
      )}
    </div>
  );
};

// ─── PRIMARY CTA (mint plate) ─────────────────────────────────────────────────
// Booklet + Starfield treatment: flat squared mint plate with ink text
// (matches the SAT booklet's "SAT PREP PROGRAM" badge), uppercase tracked
// label, and a full color INVERSION on hover (Starfield's selected-row
// grammar: mint-on-navy ↔ navy-on-mint).
// ─── BUTTON SYSTEM (matched to synergyprep.netlify.app) ─────────────────────
// Pill buttons: Poppins 700, 30px radius, 2px transparent border.
//   sky   — sky fill, navy text, sky2 hover + white shine-sweep ::after
//   ghost — transparent, white text, faint white border; sky on hover
// Hover lifts -2px. All motion removed under prefers-reduced-motion.
const ensureButtonStyles = () => {
  if (typeof document === 'undefined') return;
  if (document.getElementById('sp-btn-styles')) return;
  const el = document.createElement('style');
  el.id = 'sp-btn-styles';
  el.textContent = `
    .sp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: ${FF.heading}; font-weight: 700;
      padding: 13px 26px; border-radius: 30px;
      cursor: pointer; border: 2px solid transparent; white-space: nowrap;
      position: relative; overflow: hidden;
      transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
      text-decoration: none;
    }
    .sp-btn:hover { transform: translateY(-2px); }
    .sp-btn-sky { background: ${T.cyan}; color: ${T.goldText}; }
    .sp-btn-sky:hover { background: ${T.cyanDark}; }
    .sp-btn-sky::after {
      content: ''; position: absolute; top: 0; left: -140%;
      width: 55%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
      transform: skewX(-20deg); transition: left .6s;
    }
    .sp-btn-sky:hover::after { left: 150%; }
    .sp-btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
    .sp-btn-ghost:hover { border-color: ${T.cyan}; color: ${T.cyan}; }
    @media (prefers-reduced-motion: reduce) {
      .sp-btn, .sp-btn-sky::after { transition: none !important; }
      .sp-btn:hover { transform: none; }
      .sp-btn-sky::after { display: none; }
    }
  `;
  document.head.appendChild(el);
};

const PrimaryCTA = ({ children, onClick, size = 'md', style }) => {
  React.useEffect(() => { ensureButtonStyles(); }, []);
  const sizes = {
    md: { fontSize: 'clamp(14px, 0.3vw + 11px, 15px)' },
    lg: { fontSize: 'clamp(15px, 0.3vw + 12px, 16px)', padding: '15px 30px' },
  };
  return (
    <button onClick={onClick} className="sp-btn sp-btn-sky" style={{ ...sizes[size], boxShadow: T.shadowBtn, ...(style || {}) }}>
      {children}
    </button>
  );
};

// ─── SECONDARY CTA (hairline outline) ────────────────────────────────────────
// Starfield treatment: squared, 1px hairline (was a 2px rounded pill),
// inversion fill on hover, uppercase tracked label.
const SecondaryCTA = ({ children, onClick, light = false, style }) => {
  React.useEffect(() => { ensureButtonStyles(); }, []);
  // `light` kept for call-site compatibility — the ghost variant is always

  return (
    <button onClick={onClick} className="sp-btn sp-btn-ghost" style={{
      fontSize: 'clamp(14px, 0.3vw + 11px, 15px)',
      ...(style || {}),
    }}>
      {children}
    </button>
  );
};

// ─── MINT PLATE (reserved CTA — was the gold gradient pill) ──────────────────
// Booklets contain no gold: the reserved celebratory CTA is now a flat mint
// plate (T.gold1/gold2 hold mint values for back-compat).
const GoldPill = ({ children, onClick, size = 'md' }) => {
  React.useEffect(() => { ensureButtonStyles(); }, []);

    md: { fontSize: 'clamp(13px, 0.3vw + 10px, 14px)', padding: '10px 22px' },

  return (
    <button onClick={onClick} className="sp-btn sp-btn-sky" style={{ ...sizes[size], boxShadow: T.shadowGold }}>
      {children}
    </button>
  );
};

// ─── HORIZONTAL BAR CHART ─────────────────────────────────────────────────────
// Each row is independently hoverable: the bar fill saturates to cyanDark,
// the row's track tints cyan-light, the label gains weight, the value scales
// up, and the whole row lifts 2px. Optional `unit` prop adds a suffix to
// the value on hover (e.g., "82%" instead of "82").
const BarChart = ({ data, light = false, maxLabel = '160px', unit = '' }) => {
  const max = Math.max(...data.map(d => d.value));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, width: '100%' }}>
      {data.map((row, i) => (
        <BarChartRow
          key={i} row={row} max={max} maxLabel={maxLabel} light={light} unit={unit}
        />
      ))}
    </div>
  );
};

const BarChartRow = ({ row, max, maxLabel, light, unit }) => {
  const [hov, setHov] = React.useState(false);
  const pct = (row.value / max) * 100;
  return (
    <div
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      onFocus={() => setHov(true)}
      onBlur={() => setHov(false)}
      tabIndex={0}
      role="img"
      aria-label={`${row.label}: ${row.value}${unit}`}
      style={{
        display: 'flex', alignItems: 'center', gap: 16,
        cursor: 'default',
        transform: hov ? 'translateX(2px)' : 'translateX(0)',
        transition: `transform ${T.dur1} ${T.ease}`,
      }}
    >
      <div style={{
        width: maxLabel, fontFamily: FF.ui, fontWeight: hov ? 700 : 500, fontSize: 'clamp(15px, 0.3vw + 11px, 17px)',
        color: hov ? T.cyanDark : '#fff',
        transition: `all ${T.dur1} ${T.ease}`,
      }}>{row.label}</div>
      <div style={{
        flex: 1, height: 28, borderRadius: 8,
        background: hov ? 'rgba(111, 197, 219, 0.15)' : 'rgba(255,255,255,0.10)',
        overflow: 'hidden', position: 'relative',
        transition: `background ${T.dur1} ${T.ease}`,
      }}>
        <div style={{
          height: '100%', width: `${pct}%`,
          background: hov
            ? `linear-gradient(90deg, ${T.cyanDark} 0%, ${T.cyan} 100%)`
            : T.cyan,
          borderRadius: 8,
          transition: `width 800ms ease, background ${T.dur1} ${T.ease}, box-shadow ${T.dur1} ${T.ease}`,
          boxShadow: hov ? '0 4px 12px rgba(108, 195, 219,0.35)' : 'none',
        }} />
      </div>
      <div style={{
        width: 64, textAlign: 'right',
        fontFamily: FF.heading, fontWeight: 700,
        fontSize: hov ? 22 : 18,
        color: hov ? T.cyanDark : T.cyan,
        letterSpacing: '-0.01em',
        transition: `all ${T.dur1} ${T.ease}`,
      }}>{row.value}{unit}</div>
    </div>
  );
};

// ─── ACCORDION (FAQ) ──────────────────────────────────────────────────────────
const FAQAccordion = ({ items }) => {
  const [open, setOpen] = React.useState(null);
  return (
    <div style={{ maxWidth: 760, margin: '0 auto' }}>
      {items.map((it, i) => (
        <div key={i} style={{ borderBottom: `1px solid ${T.border}` }}>
          <button onClick={() => setOpen(open === i ? null : i)} style={{
            width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            background: 'none', border: 'none', cursor: 'pointer',
            padding: '24px 0', textAlign: 'left',
            fontFamily: FF.ui, fontWeight: 500, fontSize: 'clamp(18px, 0.35vw + 13px, 20px)', color: T.white, letterSpacing: '0.005em',
          }}>
            <span>{it.q}</span>
            <span style={{
              fontSize: 'clamp(20px, 0.4vw + 14px, 22px)', color: T.white, marginLeft: 20,
              transform: open === i ? 'rotate(180deg)' : 'none',
              transition: 'transform 200ms ease', flexShrink: 0,
            }}>⌄</span>
          </button>
          {open === i && (
            <div style={{
              fontFamily: FF.body, fontSize: 'clamp(16px, 0.3vw + 12px, 18px)', lineHeight: 1.6, color: T.ink,
              paddingBottom: 24, paddingRight: 40,
            }}>{it.a}</div>
          )}
        </div>
      ))}
    </div>
  );
};

// + white Poppins wordmark. Renders on any navy surface; `light` kept for

const SiteLogo = ({ light = false, size = 36, as = 'span', markOnly = false }) => {
  // The real synergy-prep.com wordmark (white "Synergy" + sky "Prep" PNG,
  // designed for dark surfaces). `markOnly` renders the star instead.
  const Tag = as;
  return (
    <Tag
      aria-label="Synergy Prep"

        display: 'inline-flex',

// ─── WAVE BACKGROUND ──────────────────────────────────────────────────────────
// Four heavily-blurred radial-gradient blobs that drift across a section like
// ocean swell. Used on every Section variant so the whole site reads as
// quietly moving rather than static. Variant tunes the palette to the
// underlying section background:
//
//   - "white" — very subtle cyan + navy blobs over a white ground
//   - "light" — moderate cyan + navy blobs over near-white
//   - "navy"  — bright cyan blobs over a navy ground
//   - "cyan"  — vivid blobs over a cyan ground (diagnostic section)
//   - "off"   — render nothing (escape hatch for sections that need stillness)
//
// Mounts its own keyframes one time via an injected <style> block.
// Honors prefers-reduced-motion (blobs freeze in place).
const WaveBackground = ({ variant = 'light' }) => {
  React.useEffect(() => {
    if (typeof document === 'undefined') return;
    if (document.getElementById('sp-wave-bg-styles')) return;
    const el = document.createElement('style');
    el.id = 'sp-wave-bg-styles';
    el.textContent = `
      @keyframes sp-wave-a {
        0%   { transform: translate3d(-18%, -10%, 0) scale(1.25); }
        33%  { transform: translate3d(10%,  -4%, 0) scale(1.45); }
        66%  { transform: translate3d(20%,  14%, 0) scale(1.30); }
        100% { transform: translate3d(-18%, -10%, 0) scale(1.25); }
      }
      @keyframes sp-wave-b {
        0%   { transform: translate3d(18%, 12%, 0) scale(1.35) rotate(0deg); }
        50%  { transform: translate3d(-14%, -10%, 0) scale(1.55) rotate(8deg); }
        100% { transform: translate3d(18%, 12%, 0) scale(1.35) rotate(0deg); }
      }
      @keyframes sp-wave-c {
        0%   { transform: translate3d(-8%, 14%, 0) scale(1.15); }
        50%  { transform: translate3d(14%, -8%, 0) scale(1.45); }
        100% { transform: translate3d(-8%, 14%, 0) scale(1.15); }
      }
      @keyframes sp-wave-d {
        0%   { transform: translate3d(8%, -16%, 0) scale(1.20) rotate(0deg); }
        50%  { transform: translate3d(-12%, 18%, 0) scale(1.40) rotate(-6deg); }
        100% { transform: translate3d(8%, -16%, 0) scale(1.20) rotate(0deg); }
      }
      .sp-wave-blob-a { animation: sp-wave-a 14s ease-in-out infinite; }
      .sp-wave-blob-b { animation: sp-wave-b 19s ease-in-out infinite; }
      .sp-wave-blob-c { animation: sp-wave-c 11s ease-in-out infinite; }
      .sp-wave-blob-d { animation: sp-wave-d 23s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .sp-wave-blob-a, .sp-wave-blob-b,
        .sp-wave-blob-c, .sp-wave-blob-d { animation: none !important; }
      }
    `;
    document.head.appendChild(el);
  }, []);

  if (variant === 'off') return null;

  const PALETTES = {
    white: {
      a: 'rgba(108, 195, 219, 0.20)',
      b: 'rgba(8, 33, 61, 0.10)',
      c: 'rgba(255, 255, 255, 0.55)',
      d: 'rgba(108, 195, 219, 0.14)',
    },
    light: {
      a: 'rgba(108, 195, 219, 0.32)',
      b: 'rgba(8, 33, 61, 0.18)',
      c: 'rgba(255, 255, 255, 0.55)',
      d: 'rgba(108, 195, 219, 0.22)',
    },
    navy: {
      a: 'rgba(108, 195, 219, 0.32)',
      b: 'rgba(255, 255, 255, 0.10)',
      c: 'rgba(108, 195, 219, 0.45)',
      d: 'rgba(8, 33, 61, 0.45)',
    },
    cyan: {
      a: 'rgba(160, 230, 255, 0.65)',
      b: 'rgba(31, 168, 224, 0.75)',
      c: 'rgba(255, 255, 255, 0.35)',
      d: 'rgba(8, 33, 61, 0.40)',
    },
  };
  const palette = PALETTES[variant] || PALETTES.light;

  return (
    <div
      aria-hidden="true"
      style={{
        position: 'absolute', inset: 0,
        overflow: 'hidden', pointerEvents: 'none',
        zIndex: 0,
      }}
    >
      <div className="sp-wave-blob-a" style={{
        position: 'absolute',
        width: '70%', height: '120%',
        top: '-10%', left: '-10%',
        background: `radial-gradient(ellipse at center, ${palette.a} 0%, transparent 60%)`,
        filter: 'blur(40px)',
        willChange: 'transform',
      }} />
      <div className="sp-wave-blob-b" style={{
        position: 'absolute',
        width: '75%', height: '110%',
        top: '-5%', right: '-15%',
        background: `radial-gradient(ellipse at center, ${palette.b} 0%, transparent 55%)`,
        filter: 'blur(50px)',
        willChange: 'transform',
      }} />
      <div className="sp-wave-blob-c" style={{
        position: 'absolute',
        width: '60%', height: '60%',
        bottom: '-10%', left: '20%',
        background: `radial-gradient(ellipse at center, ${palette.c} 0%, transparent 60%)`,
        filter: 'blur(45px)',
        willChange: 'transform',
      }} />
      <div className="sp-wave-blob-d" style={{
        position: 'absolute',
        width: '55%', height: '60%',
        top: '-8%', left: '30%',
        background: `radial-gradient(ellipse at center, ${palette.d} 0%, transparent 65%)`,
        filter: 'blur(55px)',
        willChange: 'transform',
      }} />
    </div>
  );
};

// ─── SECTION WRAPPER ──────────────────────────────────────────────────────────
// Every Section gets the animated GlassMesh background — two slowly drifting
// low-poly mesh layers plus a traveling soft glow. Opacity is tuned per
// variant so the texture is barely-there on light backgrounds and richer on
// navy/cyan brand sections.
//
// 2.1: every Section also fades its direct content children up on
// scroll-into-view, with a stagger by nth-child. CSS rules in the global
// baseline stylesheet drive the actual transition; we just toggle a
// `data-sp-in` attribute when the section enters the viewport.
const Section = ({ children, bg = 'white', pad = 'lg', style = {} }) => {
  const padding = { lg: '120px 0', md: '80px 0', sm: '64px 0' }[pad];
  const [ref, inView] = useInView({ threshold: 0.08, once: true });

  // Base background per variant. Dark-navy theme: every variant is a navy
  // shade — `white` is the page base, `light` the navy2 alt band, `navy`
  // a deeper band, `cyan` the glow panel band.
  const baseByVariant = {
    white: T.navy,
    light: `
      radial-gradient(circle at 12% 18%, rgba(111, 197, 219, 0.05), transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(111, 197, 219, 0.07), transparent 42%),
      ${T.lightGray}
    `,
    navy:  T.navyDark,
    cyan:  `linear-gradient(160deg, ${T.glow}, ${T.lightGray})`,
  };

  // Per-variant GlassMesh settings. Bumped opacities across the board so the
  // mesh + glow motion is clearly visible in addition to the wave blobs.
  const glassByVariant = {
    white: { tint: 'navy', meshOpacity: 0.10, glowOpacity: 0.16 },
    light: { tint: 'navy', meshOpacity: 0.12, glowOpacity: 0.18 },
    navy:  { tint: 'navy', meshOpacity: 0.14, glowOpacity: 0.24 },
    cyan:  { tint: 'navy', meshOpacity: 0.14, glowOpacity: 0.22 },
  };
  const glass = glassByVariant[bg];

  return (
    <section
      ref={ref}
      data-sp-section
      data-sp-section-tint="dark"
      data-sp-in={inView ? '1' : '0'}
      style={{
        background: baseByVariant[bg],
        padding,
        position: 'relative',
        overflow: 'hidden',
        ...style,
      }}
    >
      {/* WaveBackground stays off for white sections so consecutive whites
          still merge into one continuous canvas (the radial blobs are what
          previously created visible per-section zones). GlassMesh is now
          rendered on every variant, the testimonial section already
          composed it manually, and the user wants sections 6–8 to match
          that gentle drifting line-art motion. */}
      {bg !== 'white' && <WaveBackground variant={bg} />}
      {window.GlassMesh && (
        <window.GlassMesh
          tint={glass.tint}
          meshOpacity={glass.meshOpacity}
          glowOpacity={glass.glowOpacity}
        />
      )}

// ─── TAB BAR + TAB PANEL ─────────────────────────────────────────────────────
// Reusable tabbed controller. The TabBar renders the labels with a sliding
// underline indicator; TabPanel wraps content with a 320ms cross-fade +
// 8px x-translate as the active tab changes.
//
//   <TabBar tabs={['SHSAT','SAT','COLLEGE PREP']} active={i} onChange={setI} />
//   <TabPanel activeKey={i}>
//     ...content keyed off active tab...
//   </TabPanel>
const TabBar = ({ tabs, active, onChange, light = false, size = 'lg' }) => {
  const reduced = usePrefersReducedMotion();
  const refs = React.useRef([]);
  const [bar, setBar] = React.useState({ left: 0, width: 0 });
  const [hoverIdx, setHoverIdx] = React.useState(-1);

  React.useEffect(() => {
    const el = refs.current[active];
    if (!el) return;
    const parent = el.parentElement;
    if (!parent) return;
    const pr = parent.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    setBar({ left: r.left - pr.left, width: r.width });
  }, [active, tabs]);

  // Recompute on resize — fonts / line wrap can shift positions.
  React.useEffect(() => {
    const onResize = () => {
      const el = refs.current[active];
      if (!el) return;
      const parent = el.parentElement;
      if (!parent) return;
      const pr = parent.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      setBar({ left: r.left - pr.left, width: r.width });
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [active]);

  const fontSize = size === 'lg' ? 28 : 18;
  const padY     = size === 'lg' ? 14 : 10;
  const inkColor = '#fff';
  const dimColor = light ? 'rgba(255,255,255,0.55)' : T.inkMuted;
  const railColor = light ? 'rgba(255,255,255,0.15)' : T.border;

  return (
    <div role="tablist" style={{
      position: 'relative',
      display: 'flex', flexWrap: 'wrap', justifyContent: 'center',
      gap: 36, marginBottom: 40,
      borderBottom: `1px solid ${railColor}`,
      paddingBottom: 0,
    }}>
      {tabs.map((label, i) => {
        const isActive = i === active;
        const isHover  = i === hoverIdx;
        // Inactive tabs brighten to inkColor on hover; active tab stays put
        // but lifts a hair via translateY to feel pressable.
        const restColor  = isActive ? inkColor : dimColor;
        const hoverColor = isActive ? inkColor : inkColor;
        return (
          <button
            key={i}
            role="tab"
            aria-selected={isActive}
            tabIndex={isActive ? 0 : -1}
            ref={(el) => { refs.current[i] = el; }}
            onClick={() => onChange(i)}
            onMouseEnter={() => setHoverIdx(i)}
            onMouseLeave={() => setHoverIdx(-1)}
            onFocus={() => setHoverIdx(i)}
            onBlur={() => setHoverIdx(-1)}
            onKeyDown={(e) => {
              if (e.key === 'ArrowRight') onChange((i + 1) % tabs.length);
              if (e.key === 'ArrowLeft')  onChange((i - 1 + tabs.length) % tabs.length);
            }}
            style={{
              padding: `${padY}px 4px`,
              background: 'none', border: 'none', cursor: 'pointer',
              fontFamily: FF.heading,
              fontWeight: isActive ? 700 : 500,
              fontSize,
              letterSpacing: '-0.005em',
              color: isHover ? hoverColor : restColor,
              transform: reduced
                ? 'none'
                : (isHover ? 'translateY(-2px)' : 'translateY(0)'),
              transition: reduced
                ? 'none'
                : `color 200ms ${T.ease}, transform 200ms ${T.ease}, font-weight 240ms ${T.ease}`,
            }}
          >
            {label}
          </button>
        );
      })}
      {/* Sliding underline */}
      <div aria-hidden="true" style={{
        position: 'absolute',
        bottom: -1.5,
        left: bar.left, width: bar.width, height: 3,
        background: T.mint, borderRadius: 0,
        transition: reduced ? 'none' : `left 320ms ${T.ease}, width 320ms ${T.ease}`,
        pointerEvents: 'none',
      }} />
    </div>
  );
};

const TabPanel = ({ activeKey, children, height }) => {
  const reduced = usePrefersReducedMotion();
  const [shown, setShown] = React.useState(activeKey);
  const [phase, setPhase] = React.useState('in'); // 'in' | 'out'
  const lastKey = React.useRef(activeKey);

  React.useEffect(() => {
    if (activeKey === lastKey.current) return;
    if (reduced) { setShown(activeKey); lastKey.current = activeKey; return; }
    setPhase('out');
    const t = setTimeout(() => {
      setShown(activeKey);
      lastKey.current = activeKey;
      setPhase('in');
    }, 180);
    return () => clearTimeout(t);
  }, [activeKey, reduced]);

  // Direction for the 8px x-translate — guess: newer index → translate left,
  // older index → translate right.
  const direction = activeKey > lastKey.current ? 1 : -1;
  const xOut = phase === 'out' ? -8 * direction : 0;

  return (
    <div style={{
      position: 'relative',
      minHeight: height,
      opacity: phase === 'out' ? 0 : 1,
      transform: `translateX(${xOut}px)`,
      transition: reduced ? 'none' : `opacity 180ms ${T.ease}, transform 180ms ${T.ease}`,
    }}>
      {typeof children === 'function' ? children(shown) : children}
    </div>
  );
};

// ─── CORNER FAN (Handhold §11 pattern) ───────────────────────────────────────
// A low-poly fan-of-triangles radiating from a corner. Sibling vocabulary
// to the existing LowPoly mesh — same triangle alphabet, same brand colors.
// Used in pairs to flank the final CTA.
//
//   <CornerFan corner="top-left" tint="cyan" opacity={0.4} size={320} />
//   <CornerFan corner="bottom-right" tint="gold" opacity={0.3} size={320} />
const CornerFan = ({ corner = 'top-left', tint = 'cyan', opacity = 0.4, size = 320 }) => {
  // Anchor + rotation by corner — the artwork is drawn as if the rays
  // emanate from (0,0) in a 100×100 viewBox.
  const anchor = {
    'top-left':     { top: 0,    left: 0,    transform: 'rotate(0deg)' },
    'top-right':    { top: 0,    right: 0,   transform: 'rotate(90deg)' },
    'bottom-right': { bottom: 0, right: 0,   transform: 'rotate(180deg)' },
    'bottom-left':  { bottom: 0, left: 0,    transform: 'rotate(270deg)' },
  }[corner];

  const gradId = `sp-fan-${corner}-${tint}`;
  const stops = tint === 'gold'
    ? { from: T.gold1, to: T.gold2 }
    : tint === 'navy'
      ? { from: '#FFFFFF', to: T.cyan }
      : { from: T.cyan, to: T.cyanDark };

  return (
    <svg
      aria-hidden="true"
      width={size} height={size} viewBox="0 0 100 100"
      style={{
        position: 'absolute',
        ...anchor,
        pointerEvents: 'none',
        opacity,
        overflow: 'visible',
      }}
    >
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor={stops.from} />
          <stop offset="100%" stopColor={stops.to} />
        </linearGradient>
      </defs>
      <g fill={`url(#${gradId})`} stroke="rgba(255,255,255,0.55)" strokeWidth="0.4">
        {/* Fan of triangles radiating from (0,0). Same low-poly grammar as
            the existing LowPoly mesh, just composed as a directional burst. */}
        <polygon points="0,0 60,0 35,28" />
        <polygon points="0,0 35,28 18,52" />
        <polygon points="0,0 18,52 0,72" />
        <polygon points="60,0 96,18 70,40 35,28" />
        <polygon points="35,28 70,40 50,68 18,52" />
        <polygon points="70,40 96,18 100,58 80,72" />
        <polygon points="50,68 70,40 80,72 60,96" />
        <polygon points="18,52 50,68 30,96 0,72" />
        <polygon points="50,68 60,96 30,96" />
      </g>
    </svg>
  );
};

        100% { transform: translate3d(-30%, -30%, 0) rotate(0deg); opacity: 0.55; }

        background:

      }
      /* A third blob — pale white-cyan in the centre, slower drift — gives

      .sp-page-glass-blob-c {
        position: absolute;
        top: 25%; left: 30%;
        width: 50%; height: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 60%);
        filter: blur(60px);

      }
      .sp-page-glass-sheen {

// ─── ANIMATED STAT COUNTER (§9.7) ────────────────────────────────────────────
// Count-up animation on scroll-into-view. Single-fire. Honors reduced motion.
// Drop-in replacement for StatTile when the count-up moment matters.
//
// <AnimatedStat value={300} suffix="+" label="Specialized HS offers since 2020" />
// <AnimatedStat value={3}   suffix="×" label="The citywide acceptance rate" />
// <AnimatedStat value={96}  suffix="%" label="Customer satisfaction" />

const AnimatedStat = ({
  value,
  suffix = '',
  prefix = '',
  label,
  decimals = 0,
  duration = 1600,
  subordinate = false,
}) => {
  const reduced = window.usePrefersReducedMotion();
  const [ref, inView] = window.useInView({ threshold: 0.5, once: true });
  const [display, setDisplay] = React.useState(reduced ? value : 0);
  const [hov, setHov] = React.useState(false);

  React.useEffect(() => {
    if (!inView) return;
    if (reduced) { setDisplay(value); return; }

    let raf;
    const start = performance.now();
    // ease-out cubic — fast at first, settles. Matches BRIEF §9.7 spec.
    const ease = (t) => 1 - Math.pow(1 - t, 3);

    const tick = (now) => {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      setDisplay(value * ease(t));
      if (t < 1) raf = requestAnimationFrame(tick);
      else setDisplay(value);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, reduced, value, duration]);

  const formatted = decimals > 0
    ? display.toFixed(decimals)
    : Math.round(display).toString();

  const T = window.T, FF = window.FF;
  // Decide if the tile lives on a dark (navy) section. Cyan border highlight
  // on hover stays visible against either background.
  return (
    <div
      ref={ref}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      aria-label={`${prefix}${value}${suffix} ${label}`}
      style={{
        background: subordinate ? T.lightGray : T.surface1,
        border: `2px solid ${hov ? T.cyan : T.border}`,
        borderRadius: T.r3,
        padding: '40px 24px',
        boxShadow: subordinate ? 'none' : (hov ? T.shadowHover : T.shadow),
        textAlign: 'center',
        minWidth: 220,
        transform: hov ? 'translateY(-4px)' : 'translateY(0)',
        transition: reduced ? 'none' : `all ${T.dur2} ${T.ease}`,
        cursor: 'default',
      }}
    >
      <div
        aria-live="off"
        style={{
          fontFamily: FF.heading,
          fontWeight: 700,
          fontSize: 'clamp(44px, 3.5vw + 20px, 72px)',
          // 2026-05 contrast pass: navy on white (9.51:1) instead of
          // cyan on white (2.18:1). Cyan glows behind the numeral for
          // brand color presence without sacrificing legibility.
          color: subordinate ? T.inkMuted : T.navy,
          textShadow: subordinate ? 'none' : '0 0 18px rgba(108, 195, 219, 0.22)',
          lineHeight: 1,
          letterSpacing: '-0.02em',
          transform: hov ? 'scale(1.06)' : 'scale(1)',
          transformOrigin: 'center',
          transition: reduced ? 'none' : `transform ${T.dur2} ${T.easeBounce}`,
        }}
      >
        {prefix}
        <span>{formatted}</span>
        <span>{suffix}</span>
      </div>
      <div style={{
        fontFamily: FF.body,
        fontSize: 'clamp(15px, 0.3vw + 11px, 17px)',
        color: hov && !subordinate ? T.navy : T.inkMuted,
        marginTop: 12,
        lineHeight: 1.45,
        transition: reduced ? 'none' : `color ${T.dur2} ${T.ease}`,
      }}>
        {label}
      </div>
    </div>
  );
};

window.AnimatedStat = AnimatedStat;

// 5-node Diagnose → Match → Plan → Practice → Report.

// On scroll-into-view: spine draws via stroke-dashoffset, nodes light up in

// Tiny inline glyphs — sibling vocabulary to LowPoly mesh (triangles, dots, lines).
// No faces, no cartoons. Each is a 40×40 viewBox.
const NodeIcon = ({ n, color }) => {
  const stroke = { stroke: color, strokeWidth: 2.5, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' };

  switch (n) {

      return (
        <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">

};

const LearningPathway = ({ variant = 'full', activeStep = null }) => {
  const T = window.T, FF = window.FF;
  const reduced = window.usePrefersReducedMotion();
  const [ref, inView] = window.useInView({ threshold: 0.2, once: true });
  const [phase, setPhase] = React.useState(reduced ? 'done' : 'idle');
  // Track which node is being hovered — drives the cyan glow + lift.
  const [hoveredNode, setHoveredNode] = React.useState(null);

  React.useEffect(() => {
    if (!inView) return;
    if (reduced) { setPhase('done'); return; }
    // Spine draw → nodes light up sequentially → microcopy fade
    const t1 = setTimeout(() => setPhase('spine'),  60);
    const t2 = setTimeout(() => setPhase('nodes'),  260);
    const t3 = setTimeout(() => setPhase('done'),   260 + NODES.length * 200);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [inView, reduced]);

  const [isMobile, setIsMobile] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth < 768 : false
  );
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const nodeSize = isMobile ? 64 : 80;
  const spineDrawn = phase === 'spine' || phase === 'nodes' || phase === 'done';

  // ─ HORIZONTAL (desktop) ─────────────────────────────────────────────────
  if (!isMobile) {
    return (
      <div ref={ref} style={{ maxWidth: 'clamp(1100px, 72vw, 1320px)', margin: '0 auto', position: 'relative', padding: '40px 20px' }}>
        {/* Dotted cyan spine */}
        <svg
          viewBox="0 0 1000 4"
          preserveAspectRatio="none"
          style={{
            position: 'absolute',
            top: 40 + nodeSize / 2,
            left: 60,
            right: 60,
            height: 4,
            width: 'calc(100% - 120px)',
            pointerEvents: 'none',
          }}
        >
          <line
            x1="0" y1="2" x2="1000" y2="2"
            stroke={T.cyan}
            strokeWidth="3"
            strokeDasharray="2 10"
            strokeLinecap="round"
            style={{
              strokeDashoffset: spineDrawn ? 0 : 1000,
              transition: reduced ? 'none' : `stroke-dashoffset ${T.dur4} ${T.easeOut}`,
            }}
          />
        </svg>

        <div style={{
          display: 'grid',
          gridTemplateColumns: `repeat(${NODES.length}, 1fr)`,
          gap: 16,
          position: 'relative',
        }}>
          {NODES.map((node, i) => {
            const nodeIn = phase === 'nodes' || phase === 'done';
            const microIn = phase === 'done';
            const isActive = activeStep === node.n;
            const isHov = hoveredNode === node.n;
            const delay = nodeIn ? `${i * 200}ms` : '0ms';
            return (
              <div
                key={node.n}
                onMouseEnter={() => setHoveredNode(node.n)}
                onMouseLeave={() => setHoveredNode(null)}
                style={{ textAlign: 'center', position: 'relative', zIndex: 1, cursor: 'pointer' }}
              >
                <div style={{
                  width: nodeSize,
                  height: nodeSize,
                  borderRadius: '50%',
                  background: isHov ? T.cyan : T.surface1,
                  border: `3px solid ${isHov ? T.cyan : 'rgba(255,255,255,0.35)'}`,
                  display: 'inline-flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  boxShadow: (isActive || isHov) ? `0 0 0 8px rgba(108, 195, 219,0.18)` : 'none',
                  opacity: nodeIn ? 1 : 0,
                  transform: nodeIn
                    ? (isHov ? 'scale(1.1)' : 'scale(1)')
                    : 'scale(0.7)',
                  transition: reduced
                    ? 'none'
                    : `opacity ${T.dur3} ${T.ease} ${delay}, transform ${T.dur2} ${T.easeBounce}, box-shadow ${T.dur2} ${T.ease}, background ${T.dur2} ${T.ease}, border-color ${T.dur2} ${T.ease}`,
                }}>
                  <NodeIcon n={node.n} color={isHov ? '#fff' : T.navy} />
                </div>
                <div style={{
                  fontFamily: FF.ui,
                  fontWeight: 600,
                  fontSize: 'clamp(14px, 0.3vw + 10px, 16px)',
                  color: isHov ? T.cyanDark : '#fff',
                  marginTop: 16,
                  letterSpacing: '0.02em',
                  transition: reduced ? 'none' : `color ${T.dur2} ${T.ease}`,
                }}>
                  {node.label}
                </div>
                {variant === 'full' && (
                  <div style={{
                    fontFamily: FF.body,
                    fontSize: 'clamp(14px, 0.3vw + 10px, 16px)',
                    color: T.inkMuted,
                    lineHeight: 1.5,
                    maxWidth: 160,
                    margin: '8px auto 0',
                    opacity: microIn ? 1 : 0,
                    transform: microIn ? 'translateY(0)' : 'translateY(8px)',
                    transition: reduced ? 'none' : `opacity ${T.dur3} ${T.ease} ${i * 80}ms, transform ${T.dur3} ${T.ease} ${i * 80}ms`,
                  }}>
                    {node.copy}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ─ VERTICAL (mobile) ────────────────────────────────────────────────────
  return (
    <div ref={ref} style={{ maxWidth: 480, margin: '0 auto', padding: '20px 12px', position: 'relative' }}>
      {/* Vertical spine */}
      <div style={{
        position: 'absolute',
        left: 20 + nodeSize / 2 - 1.5,
        top: 40,
        bottom: 40,
        width: 3,
        background: `repeating-linear-gradient(to bottom, ${T.cyan} 0, ${T.cyan} 4px, transparent 4px, transparent 12px)`,
        clipPath: spineDrawn ? 'inset(0 0 0 0)' : 'inset(0 0 100% 0)',
        transition: reduced ? 'none' : `clip-path ${T.dur4} ${T.easeOut}`,
      }} />
      {NODES.map((node, i) => {
        const nodeIn = phase === 'nodes' || phase === 'done';
        const microIn = phase === 'done';
        const isActive = activeStep === node.n;
        const delay = nodeIn ? `${i * 200}ms` : '0ms';
        return (
          <div key={node.n} style={{ display: 'flex', gap: 24, alignItems: 'flex-start', marginBottom: 32, position: 'relative' }}>
            <div style={{
              width: nodeSize,
              height: nodeSize,
              flexShrink: 0,
              borderRadius: '50%',
              background: T.surface1,
              border: `3px solid ${T.navy}`,
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              marginLeft: 20,
              boxShadow: isActive ? `0 0 0 8px rgba(108, 195, 219,0.18)` : 'none',
              opacity: nodeIn ? 1 : 0,
              transform: nodeIn ? 'scale(1)' : 'scale(0.7)',
              transition: reduced ? 'none' : `opacity ${T.dur3} ${T.ease} ${delay}, transform ${T.dur3} ${T.easeBounce} ${delay}`,
              position: 'relative',
              zIndex: 1,
            }}>
              <NodeIcon n={node.n} color={T.navy} />
            </div>
            <div style={{ flex: 1, paddingTop: 8 }}>
              <div style={{
                fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(16px, 0.3vw + 12px, 18px)', color: T.white,
              }}>{node.label}</div>
              {variant === 'full' && (
                <div style={{
                  fontFamily: FF.body, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', color: T.inkMuted,
                  lineHeight: 1.5, marginTop: 6,
                  opacity: microIn ? 1 : 0,
                  transition: reduced ? 'none' : `opacity ${T.dur3} ${T.ease}`,
                }}>
                  {node.copy}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
};

// Illustrations resolve from window.ICON_BLOBS (data: URIs inlined at bundle
// time by the bash build step) with a relative-path fallback. This avoids

const ICON_PATHS = {
  math:           'illustrations/icon-math.svg',

};

const resolveIconSrc = (slug, fallback) => {
  const blob = (window.ICON_BLOBS || {})[slug];
  return blob || fallback;
};

const makeIconComponent = (slug, path) => ({ T, alt }) => (
  <img
    src={resolveIconSrc(slug, path)}
    alt={alt || ''}
    aria-hidden={alt ? undefined : 'true'}
    style={{ width: '100%', height: '100%', display: 'block' }}
  />
);

// TODO(syed): Confirm decision rules. Current logic is a simple decision tree
// per BRIEF §17.3 — refine when the actual recommendation logic is finalized.
const recommend = ({ grade, goal, timeline }) => {
  // SHSAT track is the most time-sensitive — gate by grade.
  if (goal === 'shsat') {
    if (grade === '5–6')         return { program: 'SHSAT Foundations',     slug: 'shsat', rationale: 'A 5th–6th grader with SHSAT in their sights has time to build the foundational math and ELA habits the test rewards. We\'d start in our SHSAT Foundations track.' };
    if (grade === '7')           return { program: 'SHSAT Foundations',     slug: 'shsat', rationale: 'Your 7th grader is targeting specialized HS within the year, the SHSAT Foundations track gives them 12 months of full prep, twice a week.' };
    if (grade === '8')           return { program: 'SHSAT Intensive',       slug: 'shsat', rationale: 'An 8th grader testing this fall needs the SHSAT Intensive track: weekly diagnostics, real test material, and small classes 3× a week.' };
    return                              { program: 'SHSAT Diagnostic Consult', slug: 'shsat', rationale: 'SHSAT is typically taken in 8th grade, let\'s talk through whether your student is still in the testing window.' };
  }
  if (goal === 'sat') {
    if (timeline === 'semester') return { program: 'SAT Sprint',         slug: 'sat',     rationale: 'A near-term SAT date means we move fast: 8 weeks of targeted prep on the Bluebook digital test, with weekly diagnostics.' };
    if (timeline === 'year')     return { program: 'SAT Bluebook Track', slug: 'sat',     rationale: 'A full year gives us room to teach the test and the underlying math/reading, our standard SAT Bluebook track.' };
    return                              { program: 'SAT Foundations',    slug: 'sat',     rationale: 'Starting early on the SAT means we can build content mastery first and layer test strategy on top.' };
  }
  // college
  if (timeline === 'semester')   return { program: 'College Sprint',     slug: 'college', rationale: 'A senior-year application push means we focus immediately on the school list, supplements, and submission timeline.' };
  if (timeline === 'year')       return { program: 'College Prep Track', slug: 'college', rationale: 'A full year gives us room to build the school list, sharpen activities, and draft strong essays.' };
  return                                { program: 'College Foundations',slug: 'college', rationale: 'Starting early means stronger essays, better-tested fits, and time to build the kind of profile selective schools actually look for.' };
};

  const [step, setStep] = React.useState(0);   // 0..2 = questions, 3 = reveal
  const [grade, setGrade]       = React.useState(stored?.grade    ?? null);
  const [goal, setGoal]         = React.useState(stored?.goal     ?? null);
  const [timeline, setTimeline] = React.useState(stored?.timeline ?? null);
  const [transition, setTransition] = React.useState('in');  // 'in' | 'out'
  // 2.2 P2: light lead capture at the reveal — a name and a phone number at
  // the moment of peak intent, so a parent who never finishes the consult
  // form is still reachable. Skippable (never trap the user).
  const [leadName, setLeadName]   = React.useState(stored?.leadName  ?? '');
  const [leadPhone, setLeadPhone] = React.useState(stored?.leadPhone ?? '');
  const [leadErr, setLeadErr]     = React.useState('');

  const answers = { grade, goal, timeline };
  const persist = (next) => {
    try { sessionStorage.setItem('synergy.diag', JSON.stringify(next)); } catch (e) { /* ignore */ }
  };

  const advance = (key, value) => {
    const next = { ...answers, [key]: value };
    persist(next);
    // P0 (2.2): first answer = diagnostic_start; third answer = complete
    // (the reveal step follows immediately after the timeline answer).
    if (key === 'grade') window.SP_TRACK && window.SP_TRACK('diagnostic_start', { context });
    if (key === 'timeline') window.SP_TRACK && window.SP_TRACK('diagnostic_complete', { context, grade: next.grade, goal: next.goal, timeline: next.timeline });
    // Animate out, then in
    if (reduced) {
      if (key === 'grade')     setGrade(value);
      if (key === 'goal')      setGoal(value);
      if (key === 'timeline')  setTimeline(value);
      setStep((s) => s + 1);
      return;
    }
    setTransition('out');
    setTimeout(() => {
      if (key === 'grade')     setGrade(value);
      if (key === 'goal')      setGoal(value);
      if (key === 'timeline')  setTimeline(value);
      setStep((s) => s + 1);
      setTransition('in');
    }, 220);
  };

  const goBack = () => {
    if (step === 0) return;
    if (reduced) { setStep(step - 1); return; }
    setTransition('out');
    setTimeout(() => { setStep(step - 1); setTransition('in'); }, 220);
  };

  // Reveal animation phase
  const [revealed, setRevealed] = React.useState(false);
  React.useEffect(() => {
    if (step !== 3) { setRevealed(false); return; }
    if (reduced) { setRevealed(true); return; }
    const t = setTimeout(() => setRevealed(true), 80);
    return () => clearTimeout(t);
  }, [step, reduced]);

  const rec = step === 3 ? recommend(answers) : null;

  const announce = step < 3 ? `Step ${step + 1} of 3` : 'Recommendation ready';

  const slideStyle = {
    opacity: transition === 'in' ? 1 : 0,
    transform: transition === 'in' ? 'translateX(0)' : 'translateX(-24px)',

                      fontFamily: FF.body, fontSize: 'clamp(16px, 0.3vw + 12px, 18px)', color: T.ink,

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center' }}>
              <button
                onClick={() => {
                  const phoneDigits = leadPhone.replace(/\D/g, '');
                  if (!leadName.trim() || phoneDigits.length < 10) {
                    setLeadErr('Add a name and a 10-digit phone so we know who to call');

                  persist({ ...answers, leadName: leadName.trim(), leadPhone: phoneDigits });
                  onComplete && onComplete(answers, rec);

                style={{
                  width: 276, height: 56, borderRadius: T.r1,
                  background: T.mint, color: T.goldText, border: 'none',
                  fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', cursor: 'pointer',
                  boxShadow: T.shadowBtn, letterSpacing: '0.08em', textTransform: 'uppercase',
                  transition: `background ${T.dur1} ${T.ease}, color ${T.dur1} ${T.ease}`,
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = T.navy; e.currentTarget.style.color = T.mint; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = T.mint; e.currentTarget.style.color = T.goldText; }}
              >Book My Free Consult</button>
              <a
                href="#consult"
                onClick={(e) => {
                  e.preventDefault();
                  onComplete && onComplete(answers, rec);
                }}
                style={{
                  fontFamily: FF.ui, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', color: T.interactive,
                  textDecoration: 'underline', padding: 4,
                }}
              >Rather just talk? Book my free consult</a>
              <a
                href={`#${rec.slug}`}
                onClick={(e) => {
                  e.preventDefault();
                  if (window.SP_NAVIGATE) window.SP_NAVIGATE(rec.slug);
                }}
                style={{
                  fontFamily: FF.ui, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', color: T.interactive,
                  textDecoration: 'underline', padding: 4,
                }}
              >See the program details</a>
            </div>
          </div>
        </div>
      )}

      {/* Skip option, present on all question steps */}
      {step < 3 && (
        <div style={{
          marginTop: 28, paddingTop: 20,
          borderTop: `1px solid ${T.border}`,
          textAlign: 'center',
          fontFamily: FF.body, fontSize: 'clamp(14px, 0.3vw + 10px, 16px)', color: T.inkMuted,
        }}>
          Rather just talk?{' '}
          <a
            href="#consult"
            onClick={(e) => {
              e.preventDefault();
              if (window.SP_NAVIGATE) window.SP_NAVIGATE('consultation');
            }}
            style={{ color: T.interactive, fontWeight: 600 }}
          >Book my free consult</a>
        </div>
      )}
    </div>
  );
};

    dates: ['Aug 2026', 'Oct 2026', 'Nov 2026', 'Dec 2026', 'Mar 2027', 'May 2027'],
  },
  shsat: {

    min: 200, max: 700, step: 5,
    defaultCurrent: 450,
    defaultTarget: 580,
    // SHSAT is administered annually in Oct/Nov; range-bracketed equivalents:
    dates: ['Oct 2026', 'Nov 2026', 'Oct 2027', 'Nov 2027'],
  },
};

// Realism copy buckets per BRIEF §9.3
const realismCopy = (gap) => {
  if (gap < 100)  return { tone: 'tight',     text: 'Tight, but very doable with focused sessions twice a week' };
  if (gap < 200)  return { tone: 'realistic', text: 'A realistic stretch with our 3× a week track and weekly diagnostics.' };
  return                  { tone: 'ambitious', text: 'Ambitious. We\'d build a 6-month plan with diagnostics every 4 weeks.' };
};

const useTweenedNumber = (target, duration = 300, reduced = false) => {
  const [value, setValue] = React.useState(target);
  const prevRef = React.useRef(target);
  React.useEffect(() => {
    if (reduced) { setValue(target); prevRef.current = target; return; }
    const from = prevRef.current;
    const to = target;
    if (from === to) return;
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(from + (to - from) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else { setValue(to); prevRef.current = to; }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, reduced]);
  return value;
};

// ─── MULTI-STEP CONSULTATION FLOW (§9.8) ─────────────────────────────────────
// 4-step staged intake: grade → goal → timing → contact → confirmation.
// Persists between steps, prefills from diagnostic-finder session storage.

const C_STEP1 = ['5–6', '7', '8', '9', '10', '11', '12'];
const C_STEP2 = [
  { id: 'shsat',   label: 'SHSAT' },

// Map diagnostic-finder goal IDs onto consultation goals
const DIAG_GOAL_MAP = {
  shsat: 'shsat', sat: 'sat', college: 'college',
};
const DIAG_TIME_MAP = {
  semester: 'month', year: 'month', early: 'explore',
};

const fmtPhone = (raw) => {
  const d = raw.replace(/\D/g, '').slice(0, 10);
  if (d.length === 0) return '';
  if (d.length < 4)   return `(${d}`;
  if (d.length < 7)   return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
};

const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

const CStepDots = ({ current, total }) => {
  const T = window.T;
  return (
    <div role="progressbar" aria-valuenow={current + 1} aria-valuemin={1} aria-valuemax={total}

const ConsultationFlow = ({ onSubmit, embedded = false }) => {
  const T = window.T, FF = window.FF;
  const LowPoly = window.LowPoly;
  const reduced = window.usePrefersReducedMotion();

  // Restore from sessionStorage. If diag answers present, prefill steps 1-3
  // and jump straight to step 4 per BRIEF §9.8. 2.2 P2: a score-calculator
  // visit also prefills the goal (synergy.calc carries test + gap + date)
  // and rides along with the submission so the team sees the score context.
  const restore = () => {
    try {
      const own = sessionStorage.getItem('synergy.consult');
      if (own) return { ...JSON.parse(own), restored: true };
      const diag = sessionStorage.getItem('synergy.diag');
      if (diag) {
        const d = JSON.parse(diag);
        return {
          grade:    d.grade ?? null,
          goal:     DIAG_GOAL_MAP[d.goal] ?? null,
          timing:   DIAG_TIME_MAP[d.timeline] ?? null,
          // 2.2 P2: the diagnostic reveal now captures these — prefill them
          // so the parent lands on a nearly-done step 4.
          name:  d.leadName  ?? '',
          email: '',
          phone: d.leadPhone ?? '',
          contact: d.leadPhone ? 'phone' : 'email',
          fromDiag: true,
        };
      }
      const calc = sessionStorage.getItem('synergy.calc');
      if (calc) {
        const c = JSON.parse(calc);
        return {
          grade: null,
          goal:  c.test === 'shsat' ? 'SHSAT' : 'SAT',
          timing: null,
          name: '', email: '', phone: '', contact: 'email',
        };
      }
    } catch (e) { /* ignore */ }
    return null;
  };
  const stored = restore();

  // Score-calculator context (if any) — attached to the submit payload.
  const calcContext = (() => {
    try { return JSON.parse(sessionStorage.getItem('synergy.calc') || 'null'); }
    catch (e) { return null; }
  })();

  const allStepsFilled = (s) => s && s.grade && s.goal && s.timing;
  const initialStep = stored?.fromDiag && allStepsFilled(stored) ? 3
                    : stored?.restored ? 0 : 0;

  const [step, setStep] = React.useState(initialStep);
  const [data, setData] = React.useState({
    grade:   stored?.grade   ?? null,
    goal:    stored?.goal    ?? null,
    timing:  stored?.timing  ?? null,
    name:    stored?.name    ?? '',
    email:   stored?.email   ?? '',
    phone:   stored?.phone   ?? '',
    contact: stored?.contact ?? 'email',
  });
  const [errors, setErrors] = React.useState({});
  const [submitted, setSubmitted] = React.useState(false);
  const [confirmDrawn, setConfirmDrawn] = React.useState(false);
  const [trans, setTrans] = React.useState('in');

  // Persist on every change
  React.useEffect(() => {
    try { sessionStorage.setItem('synergy.consult', JSON.stringify(data)); } catch (e) { /* ignore */ }
  }, [data]);

  // Confirmation reveal animation
  React.useEffect(() => {
    if (!submitted) { setConfirmDrawn(false); return; }
    if (reduced) { setConfirmDrawn(true); return; }
    const t = setTimeout(() => setConfirmDrawn(true), 80);
    return () => clearTimeout(t);
  }, [submitted, reduced]);

  const update = (key, val) => setData((d) => ({ ...d, [key]: val }));

  const animateTo = (nextStep) => {
    if (reduced) { setStep(nextStep); return; }
    setTrans('out');
    setTimeout(() => { setStep(nextStep); setTrans('in'); }, 240);
  };

  const next = (val, key) => {
    if (key) update(key, val);
    animateTo(step + 1);
  };
  const back = () => { if (step > 0) animateTo(step - 1); };

  const validateContact = () => {
    const e = {};
    if (!data.name.trim()) e.name = 'Please enter your name.';
    const hasEmail = data.email.trim();
    const hasPhone = data.phone.replace(/\D/g, '').length === 10;
    if (!hasEmail && !hasPhone) {
      e.email = 'Email or phone is required.';
      e.phone = 'Email or phone is required.';
    } else if (hasEmail && !isValidEmail(data.email)) {
      e.email = 'Please enter a valid email.';
    } else if (data.phone && !hasPhone) {
      e.phone = 'Please enter a 10-digit phone number.';
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async () => {
    if (!validateContact()) return;
    // Placeholder POST per §9.8 — stubbed for static deploy. Real wiring is
    // out of scope per §16. TODO(syed): wire to CRM endpoint when available.
    try {
      if (typeof fetch !== 'undefined') {
        await fetch('/api/consultation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(calcContext ? { ...data, scoreCalculator: calcContext } : data),
        }).catch(() => {});
      }
    } catch (e) { /* swallow, stub */ }
    try { sessionStorage.removeItem('synergy.consult'); } catch (e) {}
    // P0 (2.2): the one event that matters most — a completed consult form.
    window.SP_TRACK && window.SP_TRACK('consult_submit', { goal: data.goal || '', grade: data.grade || '' });
    setSubmitted(true);
    onSubmit && onSubmit(data);
  };

  // ── Confirmation step ────────────────────────────────────────────────
  if (submitted) {
    return (
      <div style={{
        position: 'relative',
        background: T.surface1,
        borderRadius: T.r4,
        padding: 48,
        maxWidth: 640,
        margin: '0 auto',
        boxShadow: T.shadowPop,
        transform: 'perspective(1400px) rotateX(0.5deg)',
        transformStyle: 'preserve-3d',
        overflow: 'hidden',
      }}>
        {/* Low-poly drift behind the card */}
        <div aria-hidden="true" style={{
          position: 'absolute', inset: 0, opacity: 0.04,
          transform: confirmDrawn ? 'translateY(-40px)' : 'translateY(0)',
          transition: reduced ? 'none' : 'transform 1200ms cubic-bezier(0, 0, 0.2, 1)',
        }}>
          <LowPoly variant="cyan" opacity={1} position="overlay" />
        </div>
        <div style={{ position: 'relative', textAlign: 'center' }}>
          <ConfirmCheck drawn={confirmDrawn} />
          <h2 style={{
            fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(24px, 1.4vw + 14px, 32px)',
            color: T.white, margin: '20px 0 12px',
          }}>You're in</h2>
          <p style={{
            fontFamily: FF.body, fontSize: 'clamp(17px, 0.3vw + 13px, 19px)', lineHeight: 1.6,
            color: T.ink, margin: '0 auto 28px', maxWidth: 480,
          }}>We'll reach out within 4 hours to set up your free consult, look over what you shared, and recommend the right next step. No commitment.</p>
        </div>

        {/* What happens next */}
        <div style={{
          background: T.surface2,
          borderRadius: T.r2,
          padding: '24px 28px',
          marginBottom: 28,
        }}>
          <div style={{
            fontFamily: FF.ui, fontWeight: 600, fontSize: 'clamp(12px, 0.7vw + 6px, 14px)',
            letterSpacing: '0.12em', textTransform: 'uppercase',
            color: T.white, marginBottom: 16,
          }}>What happens next</div>
          {[
            { icon: 'parent-update',    when: 'Within 24 hrs', what: 'A learning specialist reviews your submission.' },
            { icon: 'free-consult',     when: 'Within 3 days', what: 'You\'ll meet for a free 30-min consult.' },
            { icon: 'learning-plan',    when: 'Together',      what: 'We build a plan that fits your student.' },
          ].map((row, i) => (
            <div key={i} style={{

        {step === 0 && (
          <div style={slideStyle} aria-current="step">
            <h2 style={{
              fontFamily: FF.heading, fontWeight: 600, fontSize: 'clamp(23px, 1.4vw + 13px, 30px)',

    </div>
  );

// ===== modules/glass-mesh.jsx =====

// ─── GLASS MESH BACKGROUND ───────────────────────────────────────────────────
// Two layered LowPoly meshes that drift slowly in opposing directions with a
// gentle scale "breathe" — gives the hero a slow refractive feel, like
// looking through a pane of glass. No flashy motion, no parallax tricks.
// Honors prefers-reduced-motion: under that setting both layers freeze
// statically and serve as a regular low-poly overlay.
//
// <GlassMesh tint="navy" />     // for navy hero backgrounds
// <GlassMesh tint="cyan" />     // for cyan band sections
//
// Mounts a one-time <style> block with the @keyframes the first time it's
// rendered (idempotent — id-guarded).

// ─── STARFIELD ───────────────────────────────────────────────────────────────
// A subtle, drifting, twinkling star layer rendered behind the glass mesh on
// EVERY section (GlassMesh is the site-wide background primitive, so mounting
// here puts stars across the entire site). Built from tiled radial-gradient
// dot patterns so a single cheap element fills a section of any height. The
// patterns are generated ONCE (deterministic PRNG) so every mount shares the
// same scatter and there's no per-render cost. Honors prefers-reduced-motion
// (stars freeze to a static field).

// Deterministic scattered-dot tile builder. Returns a comma-separated list of
// radial-gradients (one per star) sized to a square tile that background-repeat
// then tiles across the whole section.
const SP_buildStarTile = (count, tile, maxR, colors, seed0) => {
  let seed = seed0;
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const parts = [];
  for (let i = 0; i < count; i++) {
    const x = (rand() * tile).toFixed(1);
    const y = (rand() * tile).toFixed(1);
    const r = (rand() * (maxR - 0.4) + 0.4).toFixed(2);
    const a = (0.35 + rand() * 0.65).toFixed(2);
    const c = colors[Math.floor(rand() * colors.length)];
    parts.push(`radial-gradient(${r}px ${r}px at ${x}px ${y}px, rgba(${c},${a}) 0%, rgba(${c},0) 100%)`);
  }
  return parts.join(',');
};

const SP_STAR_WHITE = '255,255,255';
const SP_STAR_CYAN  = '111,197,219';
// Two depth layers: a dense fine layer + a sparser brighter layer. The two
// twinkle on OPPOSITE phases (some stars bright while others dim) which gives
// the field life. NOTE: we deliberately do NOT animate background-position —
// animating it forces a full re-raster of every radial gradient each frame
// (very expensive ×N sections). Opacity is GPU-composited, so the gradient
// tiles rasterize ONCE and only their alpha cross-fades — cheap and smooth.
const SP_STAR_LAYERS = [
  // Layer 0 animates (opacity twinkle). Layer 1 is STATIC — painted once, no
  // compositor animation — so only ONE star layer per section animates. This
  // keeps two-density depth while halving the always-animating layer count.
  { bg: SP_buildStarTile(22, 260, 1.1, [SP_STAR_WHITE, SP_STAR_CYAN], 9173), tile: 260, twinkle: 'sp-stars-tw-a 6s', baseOpacity: 0.8, animated: true },
  { bg: SP_buildStarTile(12, 360, 1.7, [SP_STAR_WHITE], 4421),               tile: 360, twinkle: null,               baseOpacity: 0.9, animated: false },
];

const Starfield = ({ opacity = 1 }) => {
  const reduced = window.usePrefersReducedMotion();
  React.useEffect(() => {
    if (typeof document === 'undefined') return;
    if (document.getElementById('sp-starfield-styles')) return;
    const el = document.createElement('style');
    el.id = 'sp-starfield-styles';
    el.textContent = `
      @keyframes sp-stars-tw-a { 0%,100%{opacity:.5} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) {
        .sp-stars-layer { animation: none !important; opacity: .6 !important; }
      }
    `;
    document.head.appendChild(el);
  }, []);

  return (
    <div aria-hidden="true" style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', opacity }}>
      {SP_STAR_LAYERS.map((L, i) => {
        const animate = L.animated && !reduced;
        return (
          <div key={i} className="sp-stars-layer" style={{
            position: 'absolute', inset: 0,
            backgroundImage: L.bg,

            backgroundRepeat: 'repeat',

            // Only the animated layer gets an opacity twinkle (compositor-only,
            // no repaint). The static layer paints once and is left alone.
            animation: animate ? `${L.twinkle} ease-in-out infinite` : 'none',
            willChange: animate ? 'opacity' : 'auto',
          }} />
        );
      })}
    </div>
  );
